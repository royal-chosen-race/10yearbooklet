<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>風一族職場教會 - 十週年感言手冊智慧排版系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* 匯入出版級明體(標題)與黑體(內文) */
        @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;700;900&family=Noto+Sans+TC:wght@400;500;700&display=swap');
        
        :root {
            --primary-blue: #001068;
            --primary-yellow: #e8a002;
        }

        body { background-color: #0F172A; }
        .font-sans { font-family: 'Noto Sans TC', sans-serif !important; }
        .font-serif { font-family: 'Noto Serif TC', serif !important; }

        /* 從根部鎖定列印色彩 */
        html, body, .book-page, .white-layer, svg, rect {
            -webkit-print-color-adjust: exact !important;
            print-color-adjust: exact !important;
        }

        /* ── 標準三欄結構 ── */
        .app-container { display: flex; width: 100vw; height: 100vh; overflow: hidden; }
        .sidebar-panel { width: 280px; min-width: 280px; height: 100%; z-index: 40; border-right: 1px solid rgba(232,160,2,0.2); display: flex; flex-direction: column; }
        .editor-panel { width: 380px; min-width: 380px; height: 100%; z-index: 30; border-right: 1px solid rgba(255,255,255,0.1); display: flex; flex-direction: column; }
        .preview-area { flex: 1; height: 100%; background-color: #020617; display: flex; flex-direction: column; min-width: 0; z-index: 20; }

        /* ── A4 實體畫布 ── */
        .book-page {
            width: 210mm; height: 297mm; min-width: 210mm; min-height: 297mm;
            background-color: var(--primary-blue); 
            position: relative; 
            overflow: hidden !important; /* 🟢 顧問修正二：固定高度硬性鎖定，防止分欄外溢造成分頁失控 */
            display: flex; flex-direction: column; box-sizing: border-box;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5); margin-bottom: 50px;
        }

        .white-layer {
            position: absolute; inset: 12mm; background-color: #FFFFFF;
            border-radius: 45px; z-index: 10; padding: 24mm 20mm; 
            display: flex; flex-direction: column;
            box-shadow: inset 0 0 20px rgba(0,16,104,0.03);
        }

        /* ── 🟢 顧問修正四：純 CSS radial-gradient 出版級高級演色性光暈 ── */
        .corner-glow {
            position: absolute;
            z-index: 1;
            pointer-events: none;
            -webkit-print-color-adjust: exact !important;
            print-color-adjust: exact !important;
        }

        /* 右上黃金光暈 */
        .corner-top-right {
            top: -20mm;
            right: -20mm;
            width: 160mm;
            height: 160mm;
            background: radial-gradient(
                circle at top right,
                rgba(232,160,2,0.92) 0%,
                rgba(232,160,2,0.45) 28%,
                rgba(232,160,2,0.18) 48%,
                rgba(232,160,2,0.06) 62%,
                rgba(232,160,2,0) 78%
            );
        }

        /* 左下黃金光暈 */
        .corner-bottom-left {
            left: -22mm;
            bottom: -22mm;
            width: 170mm;
            height: 170mm;
            background: radial-gradient(
                circle at bottom left,
                rgba(232,160,2,0.92) 0%,
                rgba(232,160,2,0.45) 28%,
                rgba(232,160,2,0.18) 48%,
                rgba(232,160,2,0.06) 62%,
                rgba(232,160,2,0) 78%
            );
        }

        /* ── 🟢 顧問修正三：改裝高隱蔽離置式物理印刷快照通道，徹底摧毀 Tailwind 優先權死結 ── */
        #printArea {
            position: fixed;
            left: -999999px;
            top: 0;
            visibility: hidden;
        }

        .grid-flow-engine { width: 100%; display: flex; flex-direction: column; }
        .pastor-content { column-count: 2; column-gap: 16mm; column-rule: 1px dotted rgba(217,164,65,0.25); }

        p { orphans: 2 !important; widows: 2 !important; margin-bottom: 8px; }
        h2, h3, .avoid-break { break-inside: avoid; page-break-inside: avoid; break-after: avoid !important; }

        .entry-card { background: #ffffff; border-radius: 12px; padding: 12px 0px 16px 0px; display: flex; flex-direction: column; height: 100%; overflow: hidden; }

        /* 標題微浮雕刻印質感 */
        .royal-title {
            color: var(--primary-blue);
            text-shadow: 0 1px 0 rgba(255,255,255,0.7), 0 2px 4px rgba(0,16,104,0.05);
            letter-spacing: 0.05em;
        }
        .royal-headline {
            color: #0A2B66;
            font-weight: 800;
            letter-spacing: 0.04em;
            text-shadow: 0 0.4px 0 rgba(255,255,255,0.75), 0 1.2px 2px rgba(10,43,102,0.08), 0 0 0.5px rgba(245,166,35,0.22);
            -webkit-font-smoothing: antialiased;
            text-rendering: geometricPrecision;
        }

        .headline-quote-box {
            margin-bottom: 2.5rem; display: flex; align-items: center; justify-content: center; padding: 1.5rem;
            border: 1px solid rgba(217, 164, 65, 0.3); background-color: rgba(217, 164, 65, 0.06); border-radius: 1.25rem;
            position: relative; max-width: 92%; margin: 0 auto 2.5rem; min-height: 96px;
        }

        .star { position: absolute; border-radius: 50%; background: var(--primary-yellow); animation: twinkle 4s infinite ease-in-out; }
        @keyframes twinkle { 0%, 100% { opacity: 0.3; transform: scale(0.8); } 50% { opacity: 0.8; transform: scale(1.1); } }

        /* ── 🟢 顧問修正一：重新對齊並覆蓋標準印刷隔離邊界 ── */
        @media print {
            @page {
                size: A4;
                margin: 0;
            }

            /* 左側控制面板關閉 */
            .sidebar-panel,
            .editor-panel,
            header,
            .preview-nav,
            .no-print {
                display: none !important;
            }

            /* 保留預覽大區存在，防止 Layout Tree 物理座標瓦解 */
            .preview-area {
                display: block !important;
                width: 100% !important;
                height: auto !important;
                overflow: visible !important;
                background: white !important;
            }

            /* 預覽 canvas 容器不進入印表機編制 */
            #canvas {
                display: none !important;
            }

            /* 真正用於高精列印的數據管道容器強制放行 */
            #printArea,
            #printArea.hidden {
                display: block !important;
                visibility: visible !important;
                position: static !important;
                width: 100% !important;
            }

            /* 防止 overflow 裁切，解除分頁塌陷 */
            .book-page {
                width: 210mm !important;
                height: 297mm !important;
                margin: 0 !important;
                page-break-after: always !important;
                break-after: page !important;
                box-shadow: none !important;
                overflow: hidden !important; 
                display: flex !important;
            }

            /* ── 🟢 顧問修正五：全置換列印保險，強制對齊 root 級渲染核心 ── */
            html {
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
            }

            body {
                background: #001068 !important;
                width: auto !important;
                height: auto !important;
                overflow: visible !important;
            }

            .book-page {
                background: #001068 !important;
                position: relative !important;
            }

            .corner-glow {
                opacity: 1 !important;
                visibility: visible !important;
                display: block !important;
            }
        }
    </style>
</head>
<body class="text-white selection:bg-[#D9A441] selection:text-[#001068] h-screen overflow-hidden flex flex-col">

    <div id="starField" class="fixed inset-0 pointer-events-none opacity-40"></div>

    <header class="h-16 bg-gradient-to-r from-[#001068] to-[#030712] border-b border-[#D9A441]/30 z-50 flex items-center px-6 no-print shrink-0">
        <div class="flex items-center gap-3 font-serif whitespace-nowrap">
            <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-[#D9A441] to-[#FBBF24] flex items-center justify-center text-[#001068] font-black text-xl shadow-lg">風</div>
            <div>
                <h1 class="text-sm font-bold text-[#FBBF24] leading-tight tracking-wider">十週年感言手冊產生系統</h1>
                <p class="text-[10px] text-white/50 font-sans uppercase tracking-[2px]">Royal Chosen Race Editorial Book System</p>
            </div>
        </div>
        
        <div id="safetyBadge" class="ml-8 px-4 py-1.5 rounded-full bg-emerald-950/80 border border-emerald-500 text-emerald-400 text-xs font-bold flex items-center gap-2">
            <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span> 系統狀態：出版編排安全 (✓ 已自動儲存)
        </div>

        <div class="ml-auto flex gap-4 whitespace-nowrap">
            <button onclick="runPreflightCheck()" class="px-4 py-2 rounded-lg border border-amber-500/40 text-amber-400 text-sm font-medium hover:bg-amber-500/10 transition-colors">📋 全書健檢</button>
            <button class="px-4 py-2 rounded-lg border border-white/20 text-white/80 text-sm font-medium hover:bg-white/10 transition-colors" onclick="toggleViewMode()">
                切換至 <span id="lblViewMode">單頁</span> 視角
            </button>
            <button id="btnExportPdf" onclick="exportPDF()" class="px-6 py-2 rounded-full bg-gradient-to-r from-[#D9A441] to-[#D97706] text-white font-bold text-sm hover:scale-105 transition-all shadow-lg">📥 匯出印刷 PDF</button>
        </div>
    </header>

    <div class="app-container flex-1">
        <aside class="sidebar-panel bg-slate-950 flex flex-col no-print">
            <div class="p-4 border-b border-white/10 shrink-0 space-y-3">
                <div class="text-[10px] font-bold text-[#D9A441] uppercase tracking-widest">肢體名單 (手動排序)</div>
                <input type="text" id="searchFilter" oninput="renderSidebar()" placeholder="🔍 搜尋姓名小組..." class="w-full bg-slate-900 border border-white/10 rounded-lg p-2.5 text-xs text-white outline-none focus:border-[#D9A441]">
                
                <div class="bg-slate-900/60 p-2.5 rounded-xl border border-white/5 space-y-2">
                    <label class="flex items-center gap-2 text-[11px] text-gray-300 cursor-pointer select-none">
                        <input type="checkbox" id="chkSmartSort" onchange="state.smartSort = this.checked; saveState(); renderCanvas();" class="accent-[#D9A441]"> 智慧對稱平衡排版
                    </label>
                    <label class="flex items-center gap-2 text-[11px] text-gray-300 cursor-pointer select-none">
                        <input type="checkbox" id="chkLockLayout" onchange="state.isLocked = this.checked; saveState(); renderSidebar(); renderEditor();" class="accent-[#D9A441]"> 🔒 鎖定全書目前頁面流動
                    </label>
                </div>
            </div>
            
            <div id="sidebarList" class="flex-1 space-y-1.5 overflow-y-auto px-4 py-2"></div>
            
            <div class="p-4 border-t border-white/10 shrink-0">
                <button id="btnAddEntryBtn" onclick="addEntry()" class="w-full py-2.5 border border-dashed border-[#D9A441]/50 text-[#D9A441] text-xs font-bold rounded-xl hover:bg-[#D9A441]/10 transition-all">＋ 新增肢體感言</button>
            </div>
            <div class="p-4 bg-black/40 text-center shrink-0 border-t border-white/5">
                <div class="text-3xl font-serif text-[#D9A441] font-black" id="statCount">0</div>
                <div class="text-[10px] text-white/40 font-sans tracking-widest">TOTAL TESTIMONIES</div>
            </div>
        </aside>

        <main class="editor-panel bg-slate-900 flex flex-col no-print"></main>

        <section class="preview-area font-sans">
            <div class="preview-nav h-12 bg-white/5 border-b border-white/10 flex items-center px-6 justify-between shrink-0 no-print">
                <div class="flex items-center gap-2">
                    <div class="w-2 h-2 bg-green-500 rounded-full animate-pulse"></div>
                    <span class="text-[10px] text-white/40 uppercase tracking-widest font-bold">A4 實體出版物預覽 (DOM 實體高度排版)</span>
                </div>
                <div class="flex items-center gap-4">
                    <button onclick="adjustZoom(-10)" class="text-white/40 hover:text-white font-bold text-xl">－</button>
                    <span id="zoomVal" class="text-xs font-mono font-bold text-[#D9A441]">80%</span>
                    <button onclick="adjustZoom(10)" class="text-white/40 hover:text-white font-bold text-xl">＋</button>
                </div>
            </div>
            <div id="scrollViewport" class="flex-1 overflow-auto p-12 flex flex-col items-center scroll-smooth bg-slate-950 w-full no-print">
                <div id="canvas" class="origin-top transition-transform duration-200"></div>
            </div>
        </section>
    </div>

    <div id="printArea" class="print-area"></div>

    <script>
        const LAYOUTS = {
            'PASTOR': '大類一：牧者/長老專屬版 (獨立滿版頁)',
            'PASTOR_NOTITLE': '大類一：牧者/長老專屬版 - 無標題金句 (獨立滿版頁)',
            'MEMBER_TITLE': '大類二：肢體同工版 - 有標題金句 (自動流動)',
            'MEMBER_NOTITLE': '大類二：肢體同工版 - 無標題標籤 (自動流動)'
        };
        
        const GROUP_OPTIONS = [
            '牧者團隊', '長老團隊', '風吉小組', '風潔小組', '風豪小組', '風光小組', '風發小組', 
            '風欣小組', '風楚小組', '風玲小組', '風梁小組', '風炎小組', 
            '風誠小組', '風慢小組', '風大小組', '風冠小組', '風鳳小組', 
            '風儒小組', '風青小組', '銀寶團契', '風隴小組', '風勇小組', 
            '風娟小組'
        ];

        const ROLE_OPTIONS = ['(一般組員)', '主任牧師', '牧師', '長老', '師母', '傳道', '小組長', '副小組長', '區長'];
        const TITLE_OPTIONS = ['(無稱謂)', '弟兄', '姊妹'];

        let state = {
            zoom: 80, activeId: '1', viewMode: 'spread', smartSort: false, isLocked: false,
            collapsedGroups: {}, lastScrolledId: null, groupOrder: [], isEditing: false, shouldAutoScroll: false
        };
        
        state.entries = [
            { id: '1', layout: 'PASTOR', groupName: '牧者團隊', name: '葉志偉', role: '主任牧師', title: '(無稱謂)', headline: '從施洗約翰到以利亞', content: '因著神的憐憫和恩典的帶領，2011年我開始成立職場讀經小組，靠著主的大大力量，於2016年6月11日成立「中華風一族職場教會」。\n\n從一開始懷著施洗約翰的心志，在職場上傳：「天國近了，你們應該悔改」的信息，到經歷以利亞的困境：「作耶和華的僕人，只剩下我一個人了…」感謝神，祂讓我知道祂為自己留下七千人，是未曾向巴力屈膝。\n\n這十年來經歷過許多的高山低谷、苦辣酸甜，每當想到愛我的主耶穌，祂都看見，祂都知道，祂仍然掌權，就讓我得到無比的安慰和繼續奔跑的力量。恩典浩大，憐憫無窮，但願一切榮耀歸給愛我的主耶穌基督，阿們。' }
        ];

        let renderTimer = null;
        function scheduleCanvasRender() {
            clearTimeout(renderTimer);
            renderTimer = setTimeout(() => { renderCanvas(); }, 300);
        }

        // ── 🟢 顧問修正三：重寫完備的 exportPDF 控制流 ──
        async function exportPDF() {
            if (document.activeElement) {
                document.activeElement?.blur();
            }
            state.isEditing = false;
            renderCanvas();

            // 等待雙重 requestAnimationFrame 幀佈局重組完畢
            await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));

            const printArea = document.getElementById('printArea');
            printArea.style.visibility = 'visible';

            // 強制 Reflow 喚醒
            void printArea.offsetHeight;

            // 等待字體資源就緒
            await document.fonts.ready;

            setTimeout(() => {
                window.print();
            }, 150);
        }

        function ensureGroupOrder() {
            if (!state.groupOrder || !Array.isArray(state.groupOrder) || state.groupOrder.length === 0) {
                state.groupOrder = [...GROUP_OPTIONS];
            }
            state.entries.forEach(e => {
                if (e.groupName && !state.groupOrder.includes(e.groupName)) { state.groupOrder.push(e.groupName); }
            });
        }

        function saveState() {
            ensureGroupOrder();
            localStorage.setItem('royalChosenRaceBooklet', JSON.stringify({
                zoom: state.zoom, activeId: state.activeId, viewMode: state.viewMode,
                smartSort: state.smartSort, isLocked: state.isLocked,
                collapsedGroups: state.collapsedGroups, entries: state.entries,
                groupOrder: state.groupOrder
            }));
        }

        function loadState() {
            const saved = localStorage.getItem('royalChosenRaceBooklet');
            if (saved) {
                try {
                    const parsed = JSON.parse(saved);
                    if (parsed && Array.isArray(parsed.entries) && parsed.entries.length > 0) {
                        state.entries = parsed.entries;
                        state.activeId = parsed.activeId || state.entries[0].id;
                        state.zoom = parsed.zoom || 80;
                        state.viewMode = parsed.viewMode || 'spread';
                        state.smartSort = parsed.smartSort || false;
                        state.isLocked = parsed.isLocked || false;
                        state.collapsedGroups = parsed.collapsedGroups || {};
                        state.groupOrder = parsed.groupOrder || [];
                    }
                    ensureGroupOrder();
                    setTimeout(() => {
                        if(document.getElementById('chkSmartSort')) document.getElementById('chkSmartSort').checked = state.smartSort;
                        if(document.getElementById('chkLockLayout')) document.getElementById('chkLockLayout').checked = state.isLocked;
                    }, 50);
                } catch(e) { console.error("還原緩衝失敗", e); }
            } else { ensureGroupOrder(); }
        }

        function render() {
            renderSidebar(); renderEditor(); renderCanvas();
            const canvas = document.getElementById('canvas');
            if (canvas) canvas.style.transform = `scale(${state.zoom / 100})`;
        }

        function adjustZoom(v) {
            state.zoom = Math.max(30, Math.min(200, state.zoom + v));
            document.getElementById('zoomVal').innerText = `${state.zoom}%`;
            document.getElementById('canvas').style.transform = `scale(${state.zoom / 100})`;
            saveState();
        }

        function toggleViewMode() {
            state.viewMode = state.viewMode === 'spread' ? 'single' : 'spread';
            saveState(); state.lastScrolledId = null; renderCanvas();
        }

        function moveGroup(g, dir) {
            if (state.isLocked) return;
            ensureGroupOrder();
            const idx = state.groupOrder.indexOf(g);
            const tIdx = dir === 'up' ? idx - 1 : idx + 1;
            if (tIdx >= 0 && tIdx < state.groupOrder.length) {
                [state.groupOrder[idx], state.groupOrder[tIdx]] = [state.groupOrder[tIdx], state.groupOrder[idx]];
                state.shouldAutoScroll = true; saveState(); render();
            }
        }

        function moveEntry(id, dir) {
            if (state.isLocked) return;
            const idx = state.entries.findIndex(e => e.id === id);
            const g = state.entries[idx].groupName;
            let gIdxs = state.entries.map((e,i) => e.groupName === g ? i : -1).filter(i => i !== -1);
            let pos = gIdxs.indexOf(idx);
            let tPos = dir === 'up' ? pos - 1 : pos + 1;
            if (tPos >= 0 && tPos < gIdxs.length) {
                [state.entries[idx], state.entries[gIdxs[tPos]]] = [state.entries[gIdxs[tPos]], state.entries[idx]];
                state.shouldAutoScroll = true; saveState(); render();
            }
        }

        function handleDelete(id) {
            if (state.isLocked) return;
            if (confirm('確定刪除？')) {
                state.entries = state.entries.filter(e => e.id !== id);
                state.activeId = state.entries.length ? state.entries[0].id : null;
                state.shouldAutoScroll = true; saveState(); render();
            }
        }

        function duplicateEntry(id, mode) {
            if(state.isLocked) { alert('目前排版已鎖定'); return; }
            const idx = state.entries.findIndex(e => e.id === id);
            const source = state.entries[idx]; const newId = Date.now().toString(); let newEntry = {};
            if (mode === 'clone') { newEntry = { ...source, id: newId, name: source.name + ' (副本)' }; } 
            else if (mode === 'same_group') {
                newEntry = { id: newId, layout: source.layout, groupName: source.groupName, name: '新肢體成員', role: source.role, title: source.title, headline: source.headline, content: '' };
            }
            state.entries.splice(idx + 1, 0, newEntry); state.activeId = newId; 
            state.shouldAutoScroll = true; 
            saveState(); render();
        }

        function addEntry() {
            if(state.isLocked) { alert('目前排版已鎖定'); return; }
            const newId = Date.now().toString();
            state.entries.push({ id: newId, layout: 'MEMBER_TITLE', groupName: '風吉小組', name: '新肢體成員', role: '(一般組員)', title: '弟兄', headline: '請輸入金句大標', content: '在此輸入感恩感言...' });
            state.activeId = newId; state.shouldAutoScroll = true; saveState(); render();
        }

        function updateEntry(id, field, val) {
            if(state.isLocked) return;
            const entry = state.entries.find(e => e.id === id);
            if (entry) entry[field] = val;
            saveState();
            if (['groupName', 'layout', 'role', 'title'].includes(field)) {
                renderSidebar(); scheduleCanvasRender(); return;
            }
            scheduleCanvasRender();
        }

        function getCanvasRelativeTop(el) {
            const canvas = document.getElementById('canvas');
            let top = 0; while (el && el !== canvas) { top += el.offsetTop; el = el.offsetParent; }
            return top;
        }

        function handleEditorBlur() {
            requestAnimationFrame(() => {
                const editor = document.getElementById('editorUI');
                if (editor && editor.contains(document.activeElement)) return;
                state.isEditing = false; renderCanvas();
            });
        }

        function chunkItemsIntoRows(items) {
            let rows = []; let curR = []; let curG = "";
            items.forEach(it => {
                if (it.groupName !== curG || it.isFullWidth) {
                    if (curR.length > 0) { while (curR.length < 2) curR.push(null); rows.push(curR); curR = []; }
                    curG = it.groupName;
                }
                if (it.isFullWidth) { rows.push([it, "FULL_WIDTH"]); }
                else { curR.push(it); if (curR.length === 2) { rows.push(curR); curR = []; } }
            });
            if (curR.length > 0) { while (curR.length < 2) curR.push(null); rows.push(curR); }
            return rows;
        }

        function renderSidebar() {
            const list = document.getElementById('sidebarList'); if (!list) return;
            ensureGroupOrder();
            const keyword = document.getElementById('searchFilter').value.toLowerCase().trim();
            let grouped = {}; state.entries.forEach(e => { (grouped[e.groupName] = grouped[e.groupName] || []).push(e); });
            list.innerHTML = state.groupOrder.map(groupName => {
                let items = grouped[groupName]; if (!items || items.length === 0) return '';
                if (keyword && !items.some(e => e.name.toLowerCase().includes(keyword) || groupName.toLowerCase().includes(keyword))) return '';
                let isCollapsed = state.collapsedGroups[groupName];
                return `<div class="mb-2">
                    <div class="text-xs font-bold text-[#e8a002] bg-slate-900/80 p-2 rounded-lg flex items-center justify-between select-none hover:bg-slate-800 cursor-pointer transition-colors" onclick="state.collapsedGroups['${groupName}']=!${isCollapsed}; renderSidebar();">
                        <span>${isCollapsed?'▶':'▼'} ${groupName} (${items.length})</span>
                        <div class="flex gap-2" onclick="event.stopPropagation();">
                            <button onclick="moveGroup('${groupName}','up')" class="hover:text-white p-0.5">▲</button><button onclick="moveGroup('${groupName}','down')" class="hover:text-white p-0.5">▼</button>
                        </div>
                    </div>
                    <div class="${isCollapsed?'hidden':''} pl-2 mt-1 space-y-1">${items.map(e => `
                        <div class="flex items-center gap-1 group">
                            <div onclick="state.activeId='${e.id}'; state.shouldAutoScroll=true; render();" class="flex-1 p-2.5 rounded-xl cursor-pointer border ${state.activeId===e.id?'bg-[#e8a002]/20 border-[#e8a002]':'border-transparent hover:bg-white/5'}">
                                <div class="text-xs font-bold font-serif text-white">${e.name || '未命名'}</div>
                            </div>
                            <div class="opacity-0 group-hover:opacity-100 flex flex-col gap-0.5 pr-1"><button onclick="moveEntry('${e.id}','up')" class="text-[9px] hover:text-[#e8a002]">▲</button><button onclick="moveEntry('${e.id}','down')" class="text-[9px] hover:text-[#e8a002]">▼</button></div>
                        </div>`).join('')}</div>
                </div>`;
            }).join('');
            document.getElementById('statCount').innerText = state.entries.length;
        }

        function renderEditor() {
            const ui = document.querySelector('.editor-panel');
            const e = state.entries.find(x => x.id === state.activeId);
            if (!e) { ui.innerHTML = '<div class="m-auto opacity-30 font-serif text-center p-4">✦ 請選擇肢體 ✦</div>'; return; }
            ui.innerHTML = `<div id="editorUI" class="p-6 space-y-5 flex-1 overflow-y-auto">
                <h2 class="font-bold text-[#e8a002] mb-4">✍ 手冊落版控制台</h2>
                <div class="space-y-4">
                    <div><label class="text-[11px] opacity-60 font-bold">套用版型</label><select onchange="updateEntry('${e.id}','layout',this.value)" class="w-full bg-slate-800 p-3 rounded-lg text-sm text-white outline-none focus:border-[#e8a002]">${Object.keys(LAYOUTS).map(k=>`<option value="${k}" ${e.layout===k?'selected':''}>${LAYOUTS[k]}</option>`).join('')}</select></div>
                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="text-[11px] opacity-60 font-bold">小組 / 團契別</label>
                            <select onchange="updateEntry('${e.id}','groupName',this.value); render();" 
                                class="w-full bg-slate-800 border border-white/10 rounded-lg p-3 text-sm text-white outline-none">
                                ${GROUP_OPTIONS.map(g => `<option value="${g}" ${e.groupName === g ? 'selected' : ''}>${g}</option>`).join('')}
                            </select>
                        </div>
                        <div><label class="text-[11px] opacity-60 font-bold">姓名</label><input onfocus="state.isEditing=true" onblur="handleEditorBlur()" oninput="updateEntry('${e.id}','name',this.value)" value="${e.name}" class="w-full bg-slate-800 p-3 rounded-lg text-sm text-white outline-none"/></div>
                    </div>
                    <div class="grid grid-cols-2 gap-3">
                        <div><label class="text-[11px] opacity-60 font-bold">身份 (職分)</label><select onchange="updateEntry('${e.id}','role',this.value)" class="w-full bg-slate-800 p-3 rounded-lg text-sm text-white outline-none">${ROLE_OPTIONS.map(r=>`<option value="${r}" ${e.role===r?'selected':''}>${r}</option>`).join('')}</select></div>
                        <div><label class="text-[11px] opacity-60 font-bold">稱謂</label><select onchange="updateEntry('${e.id}','title',this.value)" class="w-full bg-slate-800 p-3 rounded-lg text-sm text-white outline-none">${TITLE_OPTIONS.map(t=>`<option value="${t}" ${e.title===t?'selected':''}>${t}</option>`).join('')}</select></div>
                    </div>
                    <div class="${(e.layout==='MEMBER_NOTITLE'||e.layout==='PASTOR_NOTITLE')?'hidden':''}"><label class="text-[11px] opacity-60 text-[#e8a002] font-bold">金句大標</label><input onfocus="state.isEditing=true" onblur="handleEditorBlur()" oninput="updateEntry('${e.id}','headline',this.value)" value="${e.headline || ''}" class="w-full bg-[#e8a002]/10 border border-[#e8a002]/30 p-3 rounded-lg text-sm text-[#e8a002] font-serif font-black outline-none"/></div>
                    <div><label class="text-[11px] opacity-60 font-bold">見證內文</label><textarea onfocus="state.isEditing=true" onblur="handleEditorBlur()" oninput="updateEntry('${e.id}','content',this.value)" class="w-full bg-slate-800 p-3 rounded-lg text-sm h-48 text-white outline-none font-sans leading-relaxed">${e.content || ''}</textarea></div>
                </div>
                <div class="pt-4 border-t border-white/10 space-y-2">
                    <div class="grid grid-cols-2 gap-2"><button onclick="duplicateEntry('${e.id}','same_group')" class="py-2.5 rounded-lg bg-blue-950 border border-blue-700/60 text-blue-300 text-xs font-bold hover:bg-blue-900/40 flex items-center justify-center gap-1">👥 ＋同小組新增</button><button onclick="duplicateEntry('${e.id}','clone')" class="py-2.5 rounded-lg bg-slate-800 border border-white/10 text-white/80 text-xs font-bold hover:bg-slate-700/50 flex items-center justify-center gap-1">⧉複製目前成員</button></div>
                    <button onclick="handleDelete('${e.id}')" class="w-full border border-red-500/30 py-2.5 rounded-lg text-red-400 text-xs font-bold hover:bg-red-500/10 block text-center">❌刪除此肢體</button>
                </div>
            </div>`;
        }

        function renderCanvas() {
            const container = document.getElementById('canvas'); if (!container || state.isEditing) return;
            ensureGroupOrder();
            const viewport = document.getElementById('scrollViewport'); const zoomRatio = state.zoom / 100;
            
            const editorHasFocus = document.querySelector('.editor-panel :focus');
            if (editorHasFocus) return;

            let activeRect = null;
            if (viewport) {
                const activeCard = document.querySelector(`#canvas [data-id="${state.activeId}"]`);
                if (activeCard) { activeRect = (getCanvasRelativeTop(activeCard) * zoomRatio) - viewport.scrollTop; }
            }
            container.innerHTML = ''; 
            let scratchpad = document.createElement('div'); scratchpad.style.cssText = "position: absolute; visibility: hidden; width: 210mm; top: -9999px;"; document.body.appendChild(scratchpad);
            let groupStats = {}; state.entries.forEach(e => { groupStats[e.groupName] = (groupStats[e.groupName] || 0) + 1; });
            let flattened = [];
            state.entries.forEach(entry => {
                let testCard = document.createElement('div'); testCard.style.width = "85mm"; testCard.innerHTML = buildCardHTMLString(entry);
                scratchpad.appendChild(testCard); let h = testCard.getBoundingClientRect().height; scratchpad.removeChild(testCard);
                if (h > 390 && !['PASTOR','PASTOR_NOTITLE'].includes(entry.layout)) { flattened.push({ ...entry, isFullWidth: true }); }
                else { flattened.push(entry); }
            });
            let itemsByGroup = {}; state.groupOrder.forEach(g => itemsByGroup[g] = []);
            flattened.forEach(e => { (itemsByGroup[e.groupName || '未分配'] = itemsByGroup[e.groupName || '未分配'] || []).push(e); });
            let finalQueue = [];
            state.groupOrder.forEach(g => {
                let items = itemsByGroup[g] || []; if (!items.length) return;
                let pastors = items.filter(e => ['PASTOR','PASTOR_NOTITLE'].includes(e.layout));
                let members = items.filter(e => !['PASTOR','PASTOR_NOTITLE'].includes(e.layout));
                if (state.smartSort) {
                    members.sort((a,b) => b.content.length - a.content.length);
                    let bal = []; while(members.length){ bal.push(members.shift()); if(members.length) bal.push(members.pop()); }
                    members = bal;
                } else { members.sort((a,b) => state.entries.findIndex(x=>x.id===a.id) - state.entries.findIndex(x=>x.id===b.id)); }
                finalQueue.push(...pastors, ...members);
            });
            let pages = []; let currentFlowItems = [];
            finalQueue.forEach(entry => {
                if (['PASTOR','PASTOR_NOTITLE'].includes(entry.layout)) {
                    if (currentFlowItems.length) { pages.push({ type: 'FLOW', items: currentFlowItems }); currentFlowItems = []; }
                    pages.push({ type: 'PASTOR', items: [entry] });
                } else {
                    // ── 🟢 顧問修正一：高度測量 DOM 全面與實際印刷 DOM 同步對齊 ──
                    let testItems = [...currentFlowItems, entry];
                    let testPage = document.createElement('div'); testPage.className = "book-page";
                    let whiteLayer = document.createElement('div'); whiteLayer.className = "white-layer";
                    
                    /* 模擬真實印刷 padding */
                    whiteLayer.style.padding = "24mm 18mm 24mm 22mm";
                    
                    let grid = document.createElement('div'); grid.className = "grid-flow-engine";
                    let rows = chunkItemsIntoRows(testItems);
                    grid.innerHTML = rows.map(r => r[1]==="FULL_WIDTH"?buildFullWidthCardHTMLString(r[0]):`<div class="flex gap-[14mm] mb-5">${buildCardHTMLString(r[0])}${r[1]?buildCardHTMLString(r[1]):'<div class="flex-1"></div>'}</div>`).join('');
                    
                    /* 真實 DOM 結構 */
                    whiteLayer.appendChild(grid); 
                    testPage.appendChild(whiteLayer); 
                    scratchpad.appendChild(testPage);
                    
                    /* 改成量測整頁實體高度 */
                    const pageHeight = whiteLayer.scrollHeight;
                    
                    if (pageHeight > 980 && currentFlowItems.length) { 
                        pages.push({ type: 'FLOW', items: currentFlowItems }); 
                        currentFlowItems = [entry]; 
                    } else { 
                        currentFlowItems.push(entry); 
                    }
                    scratchpad.removeChild(testPage);
                }
            });
            if (currentFlowItems.length) pages.push({ type: 'FLOW', items: currentFlowItems });
            document.body.removeChild(scratchpad);
            let pageNum = 7; let displayPages = [...pages]; if (state.viewMode === 'spread' && pageNum % 2 !== 0) displayPages.unshift({ type: 'BLANK' });
            container.innerHTML = '';
            displayPages.forEach((p,i) => {
                const spread = document.createElement('div'); spread.className = state.viewMode==='spread'?"flex shadow-2xl mb-12 relative":"mb-12 shadow-2xl relative";
                let pN = (p.type==='BLANK')?null:pageNum;
                spread.innerHTML = buildPageHTML(p, pN, groupStats);
                if (pN) pageNum++; container.appendChild(spread);
            });
            document.getElementById('printArea').innerHTML = pages.map((p,i) => buildPageHTML(p, 7+i, groupStats)).join('');
            if (viewport) { viewport.scrollHeight; if (activeRect !== null && state.shouldAutoScroll) {
                const newCard = document.querySelector(`#canvas [data-id="${state.activeId}"]`);
                if (newCard) viewport.scrollTop = (getCanvasRelativeTop(newCard) * zoomRatio) - activeRect;
            } }
        }

        function buildPageHTML(p, pageNum, groupStats) {
            const isLeft = pageNum % 2 === 0; const pd = isLeft ? 'padding: 24mm 22mm 24mm 18mm;' : 'padding: 24mm 18mm 24mm 22mm;';
            const pageIdSuffix = pageNum || 'blank_' + Math.floor(Math.random() * 1000);
            
            // ── 🟢 顧問修正四：移去內嵌式 SVG 文字，改裝高演色純 CSS 印刷特刊光暈機制 ──
            const glowCorners = `
                <div class="corner-glow corner-top-right"></div>
                <div class="corner-glow corner-bottom-left"></div>
            `;

            if (p.type === 'BLANK') return `<div class="book-page">${glowCorners}<div class="white-layer bg-[#fcfbf9] flex items-center justify-center text-gray-300 italic">Royal Chosen Race Church</div></div>`;
            
            let inner = '';
            if (p.type === 'PASTOR') {
                const item = p.items[0]; const iden = item.role==='(一般組員)'?'':item.role; const tit = item.title==='(無稱謂)'?'':item.title;
                inner = `<div class="white-layer" style="${pd}" data-id="${item.id}">
                    <div class="flex justify-between items-end border-b border-gray-200 pb-3 mb-6 font-serif">
                        <div class="text-[12.5px] font-black text-[#001068]">十載主恩 ‧ 憐憫無窮<br><span class="text-[9.5px] text-gray-400 font-sans font-normal">風一族職場教會十週年感言</span></div>
                        <div class="text-[#e8a002] text-xs font-bold tracking-widest">${item.groupName.substring(0,2)}</div>
                    </div>
                    <div class="flex flex-col flex-1 h-full pt-4">
                        ${item.layout!=='PASTOR_NOTITLE'?`<div class="headline-quote-box"><span class="text-[#e8a002] text-4xl font-black self-center -mt-1">“</span><span class="text-[22px] px-4 text-center leading-relaxed flex-1 font-black royal-title">${item.headline}</span><span class="text-[#e8a002] text-4xl font-black self-center mt-3">”</span></div>` : ''}
                        <div class="text-center mb-8"><div class="inline-flex items-center gap-3 border-b-2 border-[#e8a002] pb-2 px-6 font-serif"><span class="text-[20px] font-black text-[#001068]">${item.name}</span><span class="text-[14px] text-gray-500 font-sans">${iden} ${tit}</span></div></div>
                        <div class="pastor-content text-[14px] leading-[1.9] text-gray-700 font-sans font-normal text-justify flex-1">${item.content.split('\n').map(p=>`<p style="text-indent: 2em; margin-bottom: 1em;">${p}</p>`).join('')}</div>
                    </div></div>`;
            } else {
                let rows = chunkItemsIntoRows(p.items); let lastG = "";
                let gridHTML = rows.map(r => {
                    let banner = ''; if (r[0] && r[0].groupName !== lastG) { banner = `<div class="flex items-center gap-4 mb-4 font-serif text-[#001068] w-full"><span class="text-sm font-black tracking-widest">${r[0].groupName}</span><div class="h-[1px] bg-gradient-to-r from-[#e8a002]/60 to-transparent flex-1"></div></div>`; lastG = r[0].groupName; }
                    if (r[1] === "FULL_WIDTH") return `<div class="w-full avoid-break">${banner}${buildFullWidthCardHTMLString(r[0])}</div>`;
                    return `<div class="w-full avoid-break">${banner}<div class="flex gap-[14mm] mb-5">${buildCardHTMLString(r[0])}${r[1]?buildCardHTMLString(r[1]):'<div class="flex-1"></div>'}</div></div>`;
                }).join('');
                inner = `<div class="white-layer" style="${pd}"><div class="flex justify-between border-b border-gray-200 pb-3 mb-5 font-serif"><div class="text-[12.5px] font-black text-[#001068]">十載主恩 ‧ 憐憫無窮<br><span class="text-[9.5px] text-gray-400 font-sans font-normal">風一族職場教會 10 週年紀念</span></div><div class="text-[#e8a002] text-lg opacity-60">✦ ✦</div></div><div class="flex-1 overflow-hidden pt-2 grid-flow-engine">${gridHTML}</div></div>`;
            }
            return `<div class="book-page">${glowCorners}${inner}${pageNum?`<div class="absolute bottom-[16mm] ${isLeft?'left-[24mm]':'right-[24mm]'} text-[11px] font-sans font-bold text-gray-300 tracking-[3px] z-20">Royal Chosen Race Church ‧ P.${pageNum}</div>`:''}</div>`;
        }

        function buildFullWidthCardHTMLString(item) {
            const iden = item.role==='(一般組員)'?'':item.role; const tit = item.title==='(無稱謂)'?'':item.title;
            return `<div class="entry-card w-full flex flex-col relative" data-id="${item.id}">
                <div class="flex items-center gap-3 mb-4 font-serif shrink-0"><div class="w-12 h-12 rounded-full bg-[#001068] border-2 border-[#e8a002] flex items-center justify-center text-[#e8a002] text-base font-black shadow-sm font-sans">${item.groupName.substring(0,2)}</div><div class="text-xl font-black text-[#001068] flex items-baseline"><span class="text-[#e8a002] text-xs mr-1 relative -top-0.5">✦</span>${item.name}<span class="text-xs text-gray-400 ml-2 font-sans">${iden} ${tit}</span></div></div>
                ${item.layout==='MEMBER_TITLE'&&item.headline?`<div class="text-left mb-4 font-serif border-l-4 border-[#e8a002] pl-3"><h3 class="royal-headline text-sm font-bold leading-relaxed">${item.headline}</h3></div>`:''}
                <div class="pastor-content text-[15px] leading-relaxed text-gray-700 font-sans text-justify w-full px-1">${item.content.split('\n').map(p=>`<p style="text-indent: 2em; margin-bottom: 0.6em;">${p}</p>`).join('')}</div>
                <div class="w-full mt-4 border-t border-dotted border-[#e8a002]/40 opacity-60"></div></div>`;
        }

        function buildCardHTMLString(item) {
            if(!item) return '';
            const iden = item.role==='(一般組員)'?'':item.role; const tit = item.title==='(無稱謂)'?'':item.title;
            return `<div class="entry-card flex-1 flex flex-col h-full relative" data-id="${item.id}">
                <div class="flex items-center gap-3 mb-4 font-serif shrink-0"><div class="w-12 h-12 rounded-full bg-[#001068] border-2 border-[#e8a002] flex items-center justify-center text-[#e8a002] text-base font-black font-sans">${item.groupName.substring(0,2)}</div><div class="text-xl font-black text-[#001068] flex items-baseline"><span class="text-[#e8a002] text-xs mr-1 relative -top-0.5">✦</span>${item.name}<span class="text-xs text-gray-400 ml-2 font-sans">${iden} ${tit}</span></div></div>
                ${item.layout==='MEMBER_TITLE'&&item.headline?`<div class="text-left mb-4 font-serif border-l-4 border-[#e8a002] pl-3"><h3 class="royal-headline text-sm font-bold leading-relaxed">${item.headline}</h3></div>`:''}
                <div class="text-[15px] leading-relaxed text-gray-700 font-sans text-justify flex-1 px-1">${item.content.split('\n').map(p=>`<p style="text-indent: 2em; margin-bottom: 0.6em;">${p}</p>`).join('')}</div>
                <div class="w-full mt-4 border-t border-dotted border-[#e8a002]/40 opacity-60"></div></div>`;
        }

        // ── 🟢 顧問修正三：beforeprint 與 afterprint 攔截器更新，改採 style.visibility 指引 ──
        window.addEventListener('beforeprint', () => {
            state.isEditing = false;
            renderCanvas();
            const printArea = document.getElementById('printArea');
            printArea.style.visibility = 'visible';
        });

        window.addEventListener('afterprint', () => {
            const printArea = document.getElementById('printArea');
            printArea.style.visibility = 'hidden';
        });

        loadState(); render();
    </script>
</body>
</html>
