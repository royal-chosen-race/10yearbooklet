<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>風一族職場教會 - 十週年感言手冊智慧排版系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* 匯入出版級明體(標題)與黑體(內文) */
        @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;700;900&family=Noto+Sans+TC:wght@400;500;700&display=swap');
        
        :root {
            --primary-blue: #01177d;
            --primary-yellow: #f0a802;
        }

        body { background-color: #0F172A; }
        .font-sans { font-family: 'Noto Sans TC', sans-serif !important; }
        .font-serif { font-family: 'Noto Serif TC', serif !important; }

        /* 從根部鎖定列印色彩 */
        html, body, .book-page, .white-layer, svg, rect {
            -webkit-print-color-adjust: exact !important;
            print-color-adjust: exact !important;
        }

        /* ── 標準三欄結構 ── */
        .app-container { display: flex; width: 100vw; height: 100vh; overflow: hidden; }
        .sidebar-panel { width: 280px; min-width: 280px; height: 100%; z-index: 40; border-right: 1px solid rgba(232,160,2,0.2); display: flex; flex-direction: column; }
        .editor-panel { width: 380px; min-width: 380px; height: 100%; z-index: 30; border-right: 1px solid rgba(255,255,255,0.1); display: flex; flex-direction: column; }
        .preview-area { flex: 1; height: 100%; background-color: #020617; display: flex; flex-direction: column; min-width: 0; z-index: 20; }

        /* ── A4 實體畫布 ── */
        .book-page {
            width: 210mm; height: 297mm; min-width: 210mm; min-height: 297mm;
            background-color: var(--primary-blue); 
            position: relative; 
            overflow: hidden !important; /* 固定高度硬性鎖定，防止分欄外溢造成分頁失控 */
            display: flex; flex-direction: column; box-sizing: border-box;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5); margin-bottom: 50px;
        }

        /* 天地海邊距全面與高度測量同步 */
        .white-layer {
            position: absolute; inset: 12mm; background-color: #FFFFFF;
            border-radius: 45px; z-index: 10; padding: 14mm 16mm 16mm 16mm; 
            display: flex; flex-direction: column;
            box-shadow: inset 0 0 20px rgba(0,16,104,0.03);
            isolation: isolate; /* 徹底隔離底層光暈，阻斷方形圖層混合 Bug */
        }

        .corner-glow {
            position: absolute; z-index: 1; pointer-events: none;
        }
        .corner-top-right {
            top: -20mm; right: -20mm; width: 160mm; height: 160mm;
            background: radial-gradient(circle at top right, rgba(232,160,2,0.92) 0%, rgba(232,160,2,0.45) 28%, rgba(232,160,2,0.18) 48%, rgba(232,160,2,0) 78%);
        }
        .corner-bottom-left {
            left: -22mm; bottom: -22mm; width: 170mm; height: 170mm;
            background: radial-gradient(circle at bottom left, rgba(232,160,2,0.92) 0%, rgba(232,160,2,0.45) 28%, rgba(232,160,2,0.18) 48%, rgba(232,160,2,0) 78%);
        }

        #printArea { position: fixed; left: -999999px; top: 0; visibility: hidden; }
        .grid-flow-engine { width: 100%; display: flex; flex-direction: column; }
        .pastor-content { column-count: 2; column-gap: 16mm; column-rule: 1px dotted rgba(217,164,65,0.25); }

        /* ── 🟢 修正點 1：全域改用絕對穩定的出版級 CSS Grid 雙軌網格，走道有感拓寬至大氣的 16mm ── */
        .member-column-flow {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16mm;
            width: 100%;
        }
        .member-column-flow > div {
            break-inside: avoid;
            -webkit-column-break-inside: avoid;
            page-break-inside: avoid;
            display: block;
            width: 100%;
        }

        p { orphans: 2 !important; widows: 2 !important; margin-bottom: 6px; }
        h2, h3, .avoid-break { break-inside: avoid; page-break-inside: avoid; break-after: avoid !important; }
        
        /* ── 🟢 修正點 2：卡片加入 padding 左右安全氣墊，防止齊行文字在中央走道「硬碰硬」相撞 ── */
        .entry-card { background: #ffffff; border-radius: 12px; padding: 6px 4px 8px 4px; display: flex; flex-direction: column; height: 100%; overflow: hidden; }

        /* ── 絕對一體化出版級字體系統（統一14px大字，僅保留雙階行距微調） ── */
        .book-body-text {
            font-family: 'Noto Sans TC', sans-serif !important;
            font-size: 14px !important; /* 全書字級完全等大，絕對物盡其用 */
            font-weight: 400 !important;
            color: #374151 !important;
            text-align: justify !important;
            word-break: break-word !important;
            text-rendering: geometricPrecision !important;
            -webkit-font-smoothing: antialiased !important;
        }
        /* 標準行距模式 */
        .lh-normal {
            line-height: 1.75 !important;
            letter-spacing: 0.015em !important;
        }
        /* 緊湊行距模式 */
        .lh-compact {
            line-height: 1.55 !important;
            letter-spacing: 0.005em !important;
        }

        .book-serif-title {
            font-family: 'Noto Serif TC', serif !important;
            font-weight: 900 !important;
            letter-spacing: 0.035em !important;
            text-rendering: geometricPrecision !important;
            -webkit-font-smoothing: antialiased !important;
        }

        .book-name {
            font-family: 'Noto Serif TC', serif !important;
            font-weight: 700 !important;
            letter-spacing: 0.02em !important;
        }

        .royal-title { font-family: 'Noto Serif TC', serif !important; font-weight: 900 !important; color: var(--primary-blue); letter-spacing: 0.05em; }
        .royal-headline { font-family: 'Noto Serif TC', serif !important; color: #0A2B66; font-weight: 900 !important; font-size: 18px !important; line-height: 1.60 !important; letter-spacing: 0.035em !important; }

        /* 金句大標外框「矮化」精簡 */
        .headline-quote-box {
            font-family: 'Noto Serif TC', serif !important; user-select: none; -webkit-user-select: none;
            margin-bottom: 0.75rem; display: flex; align-items: center; justify-content: center; padding: 0.5rem 1.25rem;
            border: 1px solid rgba(217, 164, 65, 0.3); background-color: rgba(217, 164, 65, 0.06); border-radius: 0.75rem;
            position: relative; max-width: 92%; margin: 0 auto 0.75rem; min-height: 60px;
        }
        .headline-quote-box * { user-select: none; -webkit-user-select: none; }
        #canvas ::selection { background: transparent !important; color: inherit !important; }
        #canvas ::-webkit-selection { background: transparent !important; color: inherit !important; }

        @media print {
            @page { size: A4; margin: 0; }
            ::selection { background: transparent !important; color: inherit !important; }
            ::-webkit-selection { background: transparent !important; color: inherit !important; }
            .royal-title, .royal-headline, .headline-quote-box, .headline-quote-box *, h1, h2, h3, p, span { text-shadow: none !important; box-shadow: none !important; transform: none !important; will-change: auto !important; background-shadow: none !important; }
            .sidebar-panel, .editor-panel, header, .preview-nav, .no-print { display: none !important; }
            .preview-area { display: block !important; width: 100% !important; height: auto !important; overflow: visible !important; background: white !important; }
            #canvas { display: none !important; }
            #printArea, #printArea.hidden { display: block !important; visibility: visible !important; position: static !important; width: 100% !important; }
            .book-page { width: 210mm !important; height: 297mm !important; margin: 0 !important; page-break-after: always !important; box-shadow: none !important; overflow: hidden !important; }
            html { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
            body { background: #01177d !important; width: auto !important; height: auto !important; overflow: visible !important; }
            .book-page { background: #01177d !important; position: relative !important; }
            .corner-glow { opacity: 1 !important; visibility: visible !important; display: block !important; }
            .entry-card, .rounded-full, div { box-shadow: none !important; text-shadow: none !important; }

            .member-column-flow {
    display: flex;
    gap: 16mm;
    align-items: flex-start;
}

.member-column-flow > div {
    flex: 1;
    display: flex;
    flex-direction: column;
}
            .member-column-flow > div { break-inside: avoid !important; page-break-inside: avoid !important; }
            * { box-shadow: none !important; text-shadow: none !important; transform: none !important; will-change: auto !important; }
        }
    </style>
</head>
<body class="text-white selection:bg-[#D9A441] selection:text-[#01177d] h-screen overflow-hidden flex flex-col">

    <div id="starField" class="fixed inset-0 pointer-events-none opacity-40"></div>

    <header class="h-16 bg-gradient-to-r from-[#01177d] to-[#030712] border-b border-[#D9A441]/30 z-50 flex items-center px-6 no-print shrink-0">
        <div class="flex items-center gap-3 font-serif whitespace-nowrap">
            <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-[#D9A441] to-[#FBBF24] flex items-center justify-center text-[#01177d] font-black text-xl shadow-lg">風</div>
            <div>
                <h1 class="text-sm font-bold text-[#FBBF24] leading-tight tracking-wider">十週年感言手冊產生系統</h1>
                <p class="text-[10px] text-white/50 font-sans uppercase tracking-[2px]">Royal Chosen Race Editorial Book System</p>
            </div>
        </div>
        
        <div id="safetyBadge" class="ml-8 px-4 py-1.5 rounded-full bg-slate-900 border border-[#D9A441]/40 text-gray-300 text-xs font-bold flex items-center gap-2">
            📊 本書數據：<span id="lblTotalCount" class="text-[#FBBF24]">0</span> 位肢體感言 ｜ 共 <span id="lblTotalPages" class="text-[#FBBF24]">0</span> 頁完稿紙張
        </div>

        <div class="ml-auto flex gap-3 whitespace-nowrap items-center">
            <button onclick="exportDataJson()" class="px-3 py-1.5 rounded-lg border border-teal-500/40 text-teal-400 text-xs font-medium hover:bg-teal-500/10 transition-colors">📦 導出專案備份</button>
            <button onclick="triggerImportJson()" class="px-3 py-1.5 rounded-lg border border-purple-500/40 text-purple-400 text-xs font-medium hover:bg-purple-500/10 transition-colors">📂 導入專案數據</button>
            <input type="file" id="hideJsonImporter" accept=".json" onchange="importDataJson(event)" class="hidden">
            
            <div class="h-6 w-[1px] bg-white/10 mx-1"></div>
            
            <button onclick="location.reload()" class="px-4 py-2 rounded-lg border border-white/20 text-white/80 text-sm font-medium hover:bg-white/10 transition-colors">
                🔄 重新整理頁面
            </button>
            <button id="btnExportPdf" class="px-6 py-2 rounded-full bg-gradient-to-r from-[#D9A441] to-[#D97706] text-white font-bold text-sm hover:scale-105 transition-all shadow-lg" onclick="exportPDF()">📥 匯出印刷 PDF</button>
        </div>
    </header>

    <div class="app-container flex-1">
        <aside class="sidebar-panel bg-slate-950 flex flex-col no-print">
            <div class="p-4 border-b border-white/10 shrink-0 space-y-3">
                <div class="text-[10px] font-bold text-[#D9A441] uppercase tracking-widest">肢體名單 (手動排序)</div>
                <input type="text" id="searchFilter" oninput="renderSidebar()" placeholder="🔍 搜尋姓名小組..." class="w-full bg-slate-900 border border-white/10 rounded-lg p-2.5 text-xs text-white outline-none focus:border-[#D9A441]">
            </div>
            <div id="sidebarList" class="flex-1 space-y-1.5 overflow-y-auto px-4 py-2"></div>
            <div class="p-4 border-t border-white/10 shrink-0">
                <button id="btnAddEntryBtn" onclick="addEntry()" class="w-full py-2.5 border border-dashed border-[#D9A441]/50 text-[#D9A441] text-xs font-bold rounded-xl hover:bg-[#D9A441]/10 transition-all">＋ 新增肢體感言</button>
            </div>
        </aside>

        <main class="editor-panel bg-slate-900 flex flex-col no-print"></main>

        <section class="preview-area font-sans">
            <div class="preview-nav h-12 bg-white/5 border-b border-white/10 flex items-center px-6 justify-between shrink-0 no-print">
                <div class="flex items-center gap-2">
                    <div class="w-2 h-2 bg-green-500 rounded-full animate-pulse"></div>
                    <span class="text-[10px] text-white/40 uppercase tracking-widest font-bold">A4 實體出版物預覽 (縱向雙欄流式引擎)</span>
                </div>
                <div class="flex items-center gap-4">
                    <button onclick="adjustZoom(-10)" class="text-white/40 hover:text-white font-bold text-xl">－</button>
                    <span id="zoomVal" class="text-xs font-mono font-bold text-[#D9A441]">80%</span>
                    <button onclick="adjustZoom(10)" class="text-white/40 hover:text-white font-bold text-xl">＋</button>
                </div>
            </div>
            <div id="scrollViewport" class="flex-1 overflow-auto p-12 flex flex-col items-center bg-slate-950 w-full no-print">
                <div id="canvas" class="origin-top transition-transform duration-200"></div>
            </div>
        </section>
    </div>

    <div id="printArea" class="print-area"></div>

    <script>
        const LAYOUTS = {
            'LEADER': '大類一與二：牧者/長老/領袖版型',
            'MEMBER': '大類二：肢體同工常規版型',
            'MINISTRY': '大類三：事工負責人專屬版型'
        };
        
        const GROUP_OPTIONS = [
            '長老團隊', '牧者團隊', '風吉小組', '風潔小組', '風豪小組', '風光小組', '風發小組', 
            '風欣小組', '風楚小組', '風玲小組', '風梁小組', '風炎小組', 
            '風誠小組', '風鈞小組', '風大小組', '風冠小組', '風鳳小組', 
            '風儒小組', '風青小組', '銀寶團契', '風隴小組', '風勇小組', 
            '風娟小組', '招待', '影音'
        ];

        const ROLE_OPTIONS = ['(一般組員)', '主任牧師', '牧師', '長老', '師母', '傳道', '小組長', '副小組長', '區長'];
        const TITLE_OPTIONS = ['(無稱謂)', '弟兄', '姊妹'];

        let state = {
            zoom: 80, activeId: '1', viewMode: 'spread', collapsedGroups: {}, groupOrder: [], isEditing: false, shouldAutoScroll: false
        };
        
        state.entries = [
            { id: '1', type: 'LEADER', groupName: '牧者團隊', name: '葉志偉', role: '主任牧師', title: '(無稱謂)', headline: '從施洗約翰到以利亞', content: '因著神的憐憫 and 恩典的帶領，2011年我開始成立職場讀經小組，靠著主的大能大力，於2016年6月11日成立「中華風一族職場教會」。\n從一開始懷著施洗約翰的心志，在職場上傳：「天國近了，你們應該悔改」的信息，到經歷以利亞的困境‌：「作耶和華的僕人，只剩下我一個人了…」感謝神，祂讓我知道祂為自己留下七千人，是未曾向巴力屈膝。\n這十年來經歷過許多的高山低谷、苦辣酸甜，每當想到愛我的主耶穌，祂都看見，祂都知道，祂仍然掌權，就讓我得到無比的安慰和繼續奔跑的力量。\n我慢不是新約福音的開路先鋒，也非以色列的战車馬兵，但我願意一生成為神良善忠心的僕人，在風一族職場教會裏，忠心地服事神的家。\n恩典浩大，憐憫無窮，但願一切榮耀歸給愛我的主耶穌基督，阿們。', forceNewPage: false, showHeadline: true, autoCompact: false }
        ];

        // 數據轉換平滑移植引擎
        function migrateLegacyData(entries) {
            return entries.map(e => {
                if (e.layout) {
                    if (e.layout.includes('PASTOR')) e.type = 'LEADER';
                    else if (e.layout.includes('MINISTRY')) e.type = 'MINISTRY';
                    else e.type = 'MEMBER';
                    e.showHeadline = !e.layout.includes('NOTITLE');
                    e.autoCompact = (e.fontSizeMode === 'compact' || e.lineHeightMode === 'compact' || e.fontSizeMode === 'medium' || e.fontSizeMode === 'small');
                    delete e.layout; delete e.fontSizeMode; delete e.lineHeightMode;
                }
                if (e.showHeadline === undefined) e.showHeadline = true;
                if (e.autoCompact === undefined) e.autoCompact = false;
                return e;
            });
        }

        let renderTimer = null;
        function scheduleCanvasRender() {
            clearTimeout(renderTimer);
            renderTimer = setTimeout(() => { renderCanvas(); }, 150);
        }

        function exportDataJson() { ensureGroupOrder(); const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(state)); const downloadAnchor = document.createElement('a'); downloadAnchor.setAttribute("href", dataStr); const timeStamp = new Date().toISOString().slice(0,10); downloadAnchor.setAttribute("download", `風一族手冊專案備份_${timeStamp}.json`); downloadAnchor.click(); downloadAnchor.remove(); }
        function triggerImportJson() { document.getElementById('hideJsonImporter').click(); }
        
        function importDataJson(event) { 
            const file = event.target.files[0]; 
            if (!file) return; 
            const reader = new FileReader(); 
            reader.onload = function(e) { 
                try { 
                    const importedState = JSON.parse(e.target.result); 
                    if (importedState && Array.isArray(importedState.entries)) { 
                        importedState.entries = migrateLegacyData(importedState.entries); 
                        state = { ...state, ...importedState }; 
                        saveState(); 
                        render(); 
                        alert(`🎉 專案導入成功！已成功載入 ${state.entries.length} 筆肢體感言數據。`); 
                    } else { 
                        alert("❌ 錯誤檔案格式"); 
                    } 
                } catch (err) { 
                    alert("❌ 導入失敗，請檢查檔案結構"); 
                } 
            }; 
            reader.readAsText(file); 
            event.target.value = ''; 
        }

        function ensureGroupOrder() { if (!state.groupOrder || state.groupOrder.length === 0) { state.groupOrder = [...GROUP_OPTIONS]; } }
        function saveState() { ensureGroupOrder(); localStorage.setItem('royalChosenRaceBookletV3', JSON.stringify({ zoom: state.zoom, activeId: state.activeId, collapsedGroups: state.collapsedGroups, entries: state.entries, groupOrder: state.groupOrder })); }
        function loadState() { const saved = localStorage.getItem('royalChosenRaceBookletV3'); if (saved) { try { const parsed = JSON.parse(saved); if (parsed && Array.isArray(parsed.entries)) { state.entries = migrateLegacyData(parsed.entries); state.activeId = parsed.activeId || state.entries[0].id; state.zoom = parsed.zoom || 80; state.collapsedGroups = parsed.collapsedGroups || {}; state.groupOrder = parsed.groupOrder || []; } ensureGroupOrder(); } catch(e) { console.error(e); } } else { ensureGroupOrder(); } }
        function render() { renderSidebar(); renderEditor(); renderCanvas(); }
        function adjustZoom(v) { state.zoom = Math.max(30, Math.min(200, state.zoom + v)); document.getElementById('zoomVal').innerText = `${state.zoom}%`; document.getElementById('canvas').style.transform = `scale(${state.zoom / 100})`; saveState(); }
        function moveGroup(g, dir) { ensureGroupOrder(); const idx = state.groupOrder.indexOf(g); const tIdx = dir === 'up' ? idx - 1 : idx + 1; if (tIdx >= 0 && tIdx < state.groupOrder.length) { [state.groupOrder[idx], state.groupOrder[tIdx]] = [state.groupOrder[tIdx], state.groupOrder[idx]]; saveState(); render(); } }
        function moveEntry(id, dir) { const idx = state.entries.findIndex(e => e.id === id); const g = state.entries[idx].groupName; let gIdxs = state.entries.map((e,i) => e.groupName === g ? i : -1).filter(i => i !== -1); let pos = gIdxs.indexOf(idx); let tPos = dir === 'up' ? pos - 1 : pos + 1; if (tPos >= 0 && tPos < gIdxs.length) { [state.entries[idx], state.entries[gIdxs[tPos]]] = [state.entries[gIdxs[tPos]], state.entries[idx]]; saveState(); render(); } }
        function handleDelete(id) { if (confirm('確定刪除該成員？')) { state.entries = state.entries.filter(e => e.id !== id); state.activeId = state.entries.length ? state.entries[0].id : null; saveState(); render(); } }
        function duplicateEntry(id, mode) { const idx = state.entries.findIndex(e => e.id === id); const source = state.entries[idx]; const newId = Date.now().toString(); let newEntry = {}; if (mode === 'clone') { newEntry = { ...source, id: newId, name: source.name + ' (副本)', forceNewPage: false }; } else if (mode === 'same_group') { newEntry = { id: newId, type: source.type, groupName: source.groupName, name: '新肢體成員', role: source.role, title: source.title, headline: '請輸入標題', content: '', forceNewPage: false, showHeadline: true, autoCompact: false }; } state.entries.splice(idx + 1, 0, newEntry); state.activeId = newId; saveState(); render(); }
        function addEntry() { const newId = Date.now().toString(); state.entries.push({ id: newId, type: 'MEMBER', groupName: '風吉小組', name: '新肢體成員', role: '(一般組員)', title: '弟兄', headline: '請輸入金句大標', content: '在此輸入感恩見證內文...', forceNewPage: false, showHeadline: true, autoCompact: false }); state.activeId = newId; saveState(); render(); }
        
        function updateEntryDataOnly(id, field, val) { 
            const entry = state.entries.find(e => e.id === id); 
            if (entry) {
                entry[field] = val; 
            }
            saveState(); 
        }
        
        function updateEntry(id, field, val) { 
            updateEntryDataOnly(id, field, val); 
            if (['groupName', 'type', 'role', 'title', 'forceNewPage', 'showHeadline', 'autoCompact'].includes(field)) { 
                renderSidebar(); 
                scheduleCanvasRender(); 
                return; 
            } 
            scheduleCanvasRender(); 
        }

        function getCanvasRelativeTop(el) { const canvas = document.getElementById('canvas'); let top = 0; while (el && el !== canvas) { top += el.offsetTop; el = el.offsetParent; } return top; }
        function handleEditorBlur() { requestAnimationFrame(() => { const editor = document.getElementById('editorUI'); if (editor && editor.contains(document.activeElement)) return; renderCanvas(); }); }

        function renderSidebar() {
            const list = document.getElementById('sidebarList'); if (!list) return;
            ensureGroupOrder();
            const keyword = document.getElementById('searchFilter').value.toLowerCase().trim();
            let grouped = {}; state.entries.forEach(e => { (grouped[e.groupName] = grouped[e.groupName] || []).push(e); });
            list.innerHTML = state.groupOrder.map(groupName => {
                let items = grouped[groupName]; if (!items || items.length === 0) return '';

                state.isEditing = false;

                await waitForDOMRender();
                await waitForFonts();
                await sleep(200);

                printArea.classList.add('ready-print');
                void printArea.offsetHeight;
                await waitForDOMRender();

                requestAnimationFrame(() => {
                    requestAnimationFrame(() => {
                        window.print();
                    });
                });

                const cleanup = () => {
                    printArea.classList.remove('ready-print');
                    btn.disabled = false;
                    btn.innerText = '📥 匯出印刷 PDF';
                    isPrinting = false;
                    window.removeEventListener('afterprint', cleanup);
                };

                window.addEventListener('afterprint', cleanup);
                setTimeout(cleanup, 4000);

            } catch (err) {
                console.error('PDF 匯出失敗：', err);
                btn.disabled = false;
                btn.innerText = '📥 匯出印刷 PDF';
                if (printArea) printArea.classList.remove('ready-print');
                isPrinting = false;
                alert('❌ PDF 匯出失敗\n\n請重新整理頁面後再試一次。');
            }
        }

            return new Promise(resolve => {
                requestAnimationFrame(() => {
                    requestAnimationFrame(() => {
                        resolve();
                    });
                });
            });
        }

        async function waitForFonts() {
            try {
                await Promise.race([
                    Promise.all([
                        document.fonts.load('600 14px "Noto Serif TC"'),
                        document.fonts.load('700 14px "Noto Serif TC"'),
                        document.fonts.load('900 22px "Noto Serif TC"'),
                        document.fonts.load('400 14px "Noto Sans TC"'),
                        document.fonts.load('700 14px "Noto Sans TC"')
                    ]),
                    new Promise(resolve => setTimeout(resolve, 2500))
                ]);
            } catch (e) {
                console.warn('字體等待略過');
            }
        }

        loadState(); render();
    </script>
</body>
</html>
