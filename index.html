<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>風一族職場教會 - 十週年感言手冊智慧排版系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* 匯入出版級明體(標題)與黑體(內文) */
        @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;700;900&family=Noto+Sans+TC:wght@400;500;700&display=swap');
        
        body { background-color: #0F172A; }
        .font-sans { font-family: 'Noto Sans TC', sans-serif !important; }
        .font-serif { font-family: 'Noto Serif TC', serif !important; }

        /* ── 標準現代大廠 Flexbox 三欄平行解構 (防跑版與遮罩) ── */
        .app-container { 
            display: flex; 
            width: 100vw; 
            height: 100vh; 
            overflow: hidden; 
        }
        .sidebar-panel { 
            width: 280px; 
            min-width: 280px; 
            max-width: 280px; 
            height: 100%; 
            z-index: 40; 
            border-right: 1px solid rgba(245,166,35,0.2); 
            display: flex;
            flex-direction: column;
        }
        .editor-panel { 
            width: 380px; 
            min-width: 380px; 
            max-width: 380px; 
            height: 100%; 
            z-index: 30; 
            border-right: 1px solid rgba(255,255,255,0.1); 
            display: flex;
            flex-direction: column;
        }
        .preview-area { 
            flex: 1; 
            height: 100%; 
            background-color: #020617; 
            display: flex; 
            flex-direction: column; 
            min-width: 0; 
            z-index: 20;
        }

        /* ── A4 實體畫布 ── */
        .book-page {
            width: 210mm; height: 297mm; min-width: 210mm; min-height: 297mm;
            background-color: #0A2B66; 
            position: relative; overflow: hidden;
            display: flex; flex-direction: column; box-sizing: border-box;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5); margin-bottom: 50px;
        }

        .white-layer {
            position: absolute;
            inset: 12mm; 
            background-color: #FFFFFF;
            border-radius: 45px; 
            z-index: 10;
            padding: 24mm 20mm; 
            display: flex;
            flex-direction: column;
            box-shadow: inset 0 0 20px rgba(10,43,102,0.03);
        }

        .grid-flow-engine {
            width: 100%;
            display: flex;
            flex-direction: column;
        }

        .pastor-content {
            column-count: 2;
            column-gap: 16mm;
            column-rule: 1px dotted rgba(245,166,35,0.25);
        }

        p { orphans: 2 !important; widows: 2 !important; margin-bottom: 8px; }
        h2, h3, .avoid-break { break-inside: avoid; page-break-inside: avoid; break-after: avoid !important; }

        .entry-card {
            background: #ffffff;
            border-radius: 12px; 
            padding: 12px 0px 16px 0px; 
            display: flex;
            flex-direction: column;
            height: 100%;
            overflow: hidden; 
        }

        .card-overflow-error {
            border: 2px dashed #EF4444 !important;
            background-color: #FEF2F2 !important;
            position: relative;
        }

        .corner-top-right {
            position: absolute; top: 0; right: 0; width: 85mm; height: 85mm;
            background: radial-gradient(circle at top right, #F5A623 0%, #0A2B66 45%, transparent 70%);
            opacity: 0.8; z-index: 1;
        }
        .corner-bottom-left {
            position: absolute; bottom: 0; left: 0; width: 105mm; height: 105mm;
            background: radial-gradient(circle at bottom left, #F5A623 0%, #0A2B66 40%, transparent 70%);
            opacity: 0.8; z-index: 1;
        }

        .star { position: absolute; border-radius: 50%; background: #F5A623; animation: twinkle 4s infinite ease-in-out; }
        @keyframes twinkle { 0%, 100% { opacity: 0.3; transform: scale(0.8); } 50% { opacity: 0.8; transform: scale(1.1); } }

        /* 精準生產列印模式 */
        @media print {
            @page { size: A4; margin: 0; }
            header, aside, main, .h-12, button { display: none !important; }
            .app-container { display: block !important; height: auto !important; width: auto !important; overflow: visible !important; }
            .preview-area { display: block !important; position: static !important; padding: 0 !important; background: transparent !important; width: 100% !important; height: auto !important; overflow: visible !important; }
            #canvas { display: none !important; }
            .print-area { display: block !important; position: static !important; width: 100% !important; height: auto !important; overflow: visible !important; }
            .book-page { margin: 0 !important; box-shadow: none !important; page-break-after: always !important; page-break-inside: avoid !important; display: flex !important; }
        }
    </style>
</head>
<body class="text-white selection:bg-[#F5A623] selection:text-[#0A2B66] h-screen overflow-hidden flex flex-col">

    <div id="starField" class="fixed inset-0 pointer-events-none opacity-40"></div>

    <header class="h-16 bg-gradient-to-r from-[#0A2B66] to-[#030712] border-b border-[#F5A623]/30 z-50 flex items-center px-6 no-print shrink-0">
        <div class="flex items-center gap-3 font-serif whitespace-nowrap">
            <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-[#F5A623] to-[#FBBF24] flex items-center justify-center text-[#0A2B66] font-black text-xl shadow-lg">風</div>
            <div>
                <h1 class="text-sm font-bold text-[#FBBF24] leading-tight tracking-wider">十週年感言手冊產生系統</h1>
                <p class="text-[10px] text-white/50 font-sans uppercase tracking-[2px]">Royal Chosen Race Editorial Book System</p>
            </div>
        </div>
        
        <div id="safetyBadge" class="ml-8 px-4 py-1.5 rounded-full bg-emerald-950/80 border border-emerald-500 text-emerald-400 text-xs font-bold flex items-center gap-2 no-print">
            <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span> 系統狀態：出版編排安全 (✓ 已自動儲存)
        </div>

        <div class="ml-auto flex gap-4 whitespace-nowrap">
            <button onclick="runPreflightCheck()" class="px-4 py-2 rounded-lg border border-amber-500/40 text-amber-400 text-sm font-medium hover:bg-amber-500/10 transition-colors">📋 全書健檢</button>
            <button class="px-4 py-2 rounded-lg border border-white/20 text-white/80 text-sm font-medium hover:bg-white/10 transition-colors" onclick="toggleViewMode()">
                切換至 <span id="lblViewMode">單頁</span> 視角
            </button>
            <button id="btnExportPdf" onclick="window.print()" class="px-6 py-2 rounded-full bg-gradient-to-r from-[#F5A623] to-[#D97706] text-white font-bold text-sm hover:scale-105 transition-all shadow-lg">📥 匯出印刷 PDF</button>
        </div>
    </header>

    <div class="app-container flex-1">
        <aside class="sidebar-panel bg-slate-950 flex flex-col no-print">
            <div class="p-4 border-b border-white/10 shrink-0 space-y-3">
                <div class="text-[10px] font-bold text-[#F5A623] uppercase tracking-widest">肢體名單 (手動優先排序)</div>
                <input type="text" id="searchFilter" oninput="renderSidebar()" placeholder="🔍 搜尋姓名小組..." class="w-full bg-slate-900 border border-white/10 rounded-lg p-2.5 text-xs text-white outline-none focus:border-[#F5A623]">
                
                <div class="bg-slate-900/60 p-2.5 rounded-xl border border-white/5 space-y-2">
                    <label class="flex items-center gap-2 text-[11px] text-gray-300 cursor-pointer select-none">
                        <input type="checkbox" id="chkSmartSort" onchange="state.smartSort = this.checked; saveState(); renderCanvas();" class="accent-[#F5A623]"> 智慧對稱平衡排版
                    </label>
                    <label class="flex items-center gap-2 text-[11px] text-gray-300 cursor-pointer select-none">
                        <input type="checkbox" id="chkLockLayout" onchange="state.isLocked = this.checked; saveState(); renderSidebar(); renderEditor();" class="accent-[#F5A623]"> 🔒 鎖定全書目前頁面流動
                    </label>
                </div>
            </div>
            
            <div id="sidebarList" class="flex-1 space-y-1.5 overflow-y-auto px-4 py-2"></div>
            
            <div class="p-4 border-t border-white/10 shrink-0">
                <button id="btnAddEntryBtn" onclick="addEntry()" class="w-full py-2.5 border border-dashed border-[#F5A623]/50 text-[#F5A623] text-xs font-bold rounded-xl hover:bg-[#F5A623]/10 transition-all">＋ 新增肢體感言</button>
            </div>
            <div class="p-4 bg-black/40 text-center shrink-0 border-t border-white/5">
                <div class="text-3xl font-serif text-[#F5A623] font-black" id="statCount">0</div>
                <div class="text-[10px] text-white/40 font-sans tracking-widest">TOTAL TESTIMONIES</div>
            </div>
        </aside>

        <main class="editor-panel bg-slate-900 flex flex-col no-print"></main>

        <section class="preview-area font-sans">
            <div class="h-12 bg-white/5 border-b border-white/10 flex items-center px-6 justify-between shrink-0 no-print">
                <div class="flex items-center gap-2">
                    <div class="w-2 h-2 bg-green-500 rounded-full animate-pulse"></div>
                    <span class="text-[10px] text-white/40 uppercase tracking-widest font-bold">A4 實體出版物預覽 (DOM 實體高度排版)</span>
                </div>
                <div class="flex items-center gap-4">
                    <button onclick="adjustZoom(-10)" class="text-white/40 hover:text-white font-bold text-xl">－</button>
                    <span id="zoomVal" class="text-xs font-mono font-bold text-[#F5A623]">80%</span>
                    <button onclick="adjustZoom(10)" class="text-white/40 hover:text-white font-bold text-xl">＋</button>
                </div>
            </div>
            <div id="scrollViewport" class="flex-1 overflow-auto p-12 flex flex-col items-center scroll-smooth bg-slate-950 w-full">
                <div id="canvas" class="origin-top transition-transform duration-200"></div>
            </div>
        </section>
    </div>

    <div id="printArea" class="hidden print-area"></div>

    <script>
        const LAYOUTS = {
            'PASTOR': '大類一：牧者/長老專屬版 (獨立滿版頁)',
            'MEMBER_TITLE': '大類二：肢體同工版 - 有標題金句 (自動流動)',
            'MEMBER_NOTITLE': '大類二：肢體同工版 - 無標題標籤 (自動流動)'
        };
        
        const GROUP_OPTIONS = [
            '牧者團隊', '長老團隊', '風吉小組', '風潔小組', '風豪小組', '風光小組', '風發小組', 
            '風欣小組', '風楚小組', '風玲小組', '風梁小組', '風炎小組', 
            '風誠小組', '風慢小組', '風大小組', '風冠小組', '風鳳小組', 
            '風儒小組', '風青小組', '銀寶團契', '風隴小組', '風勇小組', 
            '風娟小組'
        ];

        const ROLE_OPTIONS = ['(一般組員)', '主任牧師', '牧師', '長老', '師母', '傳道', '小組長', '副小組長', '區長'];
        const TITLE_OPTIONS = ['(無稱謂)', '弟兄', '姊妹'];

        let state = {
            zoom: 80, activeId: '1', viewMode: 'spread', smartSort: false, isLocked: false,
            collapsedGroups: {}, lastScrolledId: null, groupOrder: [], 
            entries: [
                { id: '1', layout: 'PASTOR', groupName: '牧者團隊', name: '葉志偉', role: '主任牧師', title: '(無稱謂)', headline: '從施洗約翰到以利亞', content: '因著神的憐憫和恩典的帶領，2011年我開始成立職場讀經小組，靠著主的大能大力，於2016年6月11日成立「中華風一族職場教會」。\n\n從一開始懷著施洗約翰的心志，在職場上傳：「天國近了，你們應該悔改」的信息，到經歷以利亞的困境：「作耶和華的僕人，只剩下我一個人了…」感謝神，祂讓我知道祂為自己留下七千人，是未曾向巴力屈膝。\n\n這十年來經歷過許多的高山低谷、苦辣酸甜，每當想到愛我的主耶穌，祂都看見，祂都知道，祂仍然掌權，就讓我得到無比的安慰和繼續奔跑的力量。恩典浩大，憐憫無窮，但願一切榮耀歸給愛我的主耶穌基督，阿們。' },
                { id: '2', layout: 'MEMBER_TITLE', groupName: '風潔小組', name: '何姊妹', role: '(一般組員)', title: '姊妹', headline: '一路走來，神的恩典滿滿', content: '轉眼間來到風一族八年了，感謝神，給予我機會。學鼓服事，在一次又一次的服事中進步、成長。委身在風一族教會的這幾年，很感謝牧師不辭辛勞地講道、以及弟兄姊妹彼此之間的代禱與扶持，使我在信仰上更加堅定，風一族教會十週年，一路走來神的恩典滿滿！' },
                { id: '3', layout: 'MEMBER_TITLE', groupName: '風吉小組', name: '彭依嵐', role: '小組長', title: '姊妹', headline: '五載恩典，一生家人', content: '邁向十週年神聖時刻，是主任牧師與師母用生命無私付出澆灌風一族，我心中除對神的敬畏與感恩，最想表達的是最誠摯的謝意。謝謝主任牧師是位領路牧者—您講道總成為我腳前的燈、路裝備。聽著您分享真理那分堅定的眼神，是知識傳遞，更是生命榜樣！' }
            ]
        };

        function ensureGroupOrder() {
            if (!state.groupOrder || !Array.isArray(state.groupOrder) || state.groupOrder.length === 0) {
                state.groupOrder = [...GROUP_OPTIONS];
            }
            state.entries.forEach(e => {
                if (e.groupName && !state.groupOrder.includes(e.groupName)) {
                    state.groupOrder.push(e.groupName);
                }
            });
        }

        function saveState() {
            ensureGroupOrder();
            localStorage.setItem('royalChosenRaceBooklet', JSON.stringify({
                zoom: state.zoom, activeId: state.activeId, viewMode: state.viewMode,
                smartSort: state.smartSort, isLocked: state.isLocked,
                collapsedGroups: state.collapsedGroups, entries: state.entries,
                groupOrder: state.groupOrder
            }));
            const badge = document.getElementById('safetyBadge');
            if (badge && !badge.innerHTML.includes('警告')) {
                badge.className = "ml-8 px-4 py-1.5 rounded-full bg-emerald-950/80 border border-emerald-500 text-emerald-400 text-xs font-bold flex items-center gap-2 no-print";
                badge.innerHTML = `<span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span> 系統狀態：出版編排安全 (✓ 已自動儲存)`;
            }
        }

        function loadState() {
            const saved = localStorage.getItem('royalChosenRaceBooklet');
            if (saved) {
                try {
                    const parsed = JSON.parse(saved);
                    if (parsed && Array.isArray(parsed.entries) && parsed.entries.length > 0) {
                        state.entries = parsed.entries;
                        state.activeId = parsed.activeId || state.entries[0].id;
                        state.zoom = parsed.zoom || 80;
                        state.viewMode = parsed.viewMode || 'spread';
                        state.smartSort = parsed.smartSort || false;
                        state.isLocked = parsed.isLocked || false;
                        state.collapsedGroups = parsed.collapsedGroups || {};
                        state.groupOrder = parsed.groupOrder || [];
                    }
                    ensureGroupOrder();
                    setTimeout(() => {
                        if(document.getElementById('chkSmartSort')) document.getElementById('chkSmartSort').checked = state.smartSort;
                        if(document.getElementById('chkLockLayout')) document.getElementById('chkLockLayout').checked = state.isLocked;
                    }, 50);
                } catch(e) { console.error("持久化資料加載出錯", e); }
            } else {
                ensureGroupOrder();
            }
        }

        function runPreflightCheck() {
            let issues = []; let total = state.entries.length; let emptyContent = 0;
            let nameRegistry = new Set(); let hasDuplicateName = false; let missingHeadline = 0;
            let overflowCount = document.querySelectorAll('.card-overflow-error').length;

            state.entries.forEach(e => {
                let checkName = e.name || '';
                if(nameRegistry.has(checkName)) hasDuplicateName = true;
                nameRegistry.add(checkName);
                if(!e.name || e.name === '新肢體成員') issues.push(`• 肢體姓名未完成修改`);
                if(!e.content || e.content.length < 5) emptyContent++;
                if(e.layout === 'MEMBER_TITLE' && (!e.headline || e.headline.trim() === '')) missingHeadline++;
            });

            let score = Math.max(0, 100 - (issues.length * 10) - (emptyContent * 15) - (overflowCount * 25) - (hasDuplicateName ? 15 : 0) - (missingHeadline * 10));
            let msg = `＝ Royal Chosen Race 全書落版印刷健檢報告 ＝\n\n總計見證特刊篇數：${total} 篇\n排版物理溢出錯誤：${overflowCount} 處\n空白或無見證內文：${emptyContent} 篇\n有金句型版面但金句空白：${missingHeadline} 篇\n重複人名安全紅線：${hasDuplicateName ? '⚠️ 有重複名單(請檢查是否忘記改名)' : '✓ 安全'}\n\n`;
            if(score < 100) {
                msg += `[待修正指引]\n`;
                if(hasDuplicateName) msg += `• 偵測到重複的人名，請核對是否行政複製後漏改名字。\n`;
                if(missingHeadline > 0) msg += `• 有 ${missingHeadline} 篇套用有金句版型，但大標題為空。\n`;
                if(overflowCount > 0) msg += `• 有 ${overflowCount} 頁內文過長產生生產線溢出紅框。\n`;
                msg += `\n目前落版出版安全度：${score}%\n`;
            } else { msg += `✓ 完美！全書落版結構、孤寡防護與印刷高度檢測完全通過！\n目前落版出版安全度：100%`; }
            alert(msg);
        }

        function render() {
            renderSidebar();
            renderEditor();
            renderCanvas();

            const canvas = document.getElementById('canvas');
            if (canvas) canvas.style.transform = `scale(${state.zoom / 100})`;

            const zoomLabel = document.getElementById('zoomVal');
            if (zoomLabel) zoomLabel.innerText = `${state.zoom}%`;

            const viewLabel = document.getElementById('lblViewMode');
            if (viewLabel) viewLabel.innerText = state.viewMode === 'spread' ? '單頁' : '跨頁';
        }

        function adjustZoom(delta) {
            state.zoom += delta;
            if (state.zoom < 30) state.zoom = 30;
            if (state.zoom > 200) state.zoom = 200;
            const canvas = document.getElementById('canvas');
            if (canvas) canvas.style.transform = `scale(${state.zoom / 100})`;
            const zoomLabel = document.getElementById('zoomVal');
            if (zoomLabel) zoomLabel.innerText = `${state.zoom}%`;
            saveState();
        }

        function toggleViewMode() {
            state.viewMode = state.viewMode === 'spread' ? 'single' : 'spread';
            const viewLabel = document.getElementById('lblViewMode');
            if (viewLabel) viewLabel.innerText = state.viewMode === 'spread' ? '單頁' : '跨頁';
            saveState();
            state.lastScrolledId = null; 
            renderCanvas();
        }

        function moveGroup(groupName, direction) {
            if (state.isLocked) return;
            ensureGroupOrder();
            const idx = state.groupOrder.indexOf(groupName);
            if (idx === -1) return;

            const targetIdx = direction === 'up' ? idx - 1 : idx + 1;
            if (targetIdx < 0 || targetIdx >= state.groupOrder.length) return;

            [state.groupOrder[idx], state.groupOrder[targetIdx]] = [state.groupOrder[targetIdx], state.groupOrder[idx]];
            
            state.lastScrolledId = null; 
            saveState();
            render();
        }

        function moveEntry(id, direction) {
            if (state.isLocked) return;
            const index = state.entries.findIndex(e => e.id === id);
            if (index === -1) return;

            const targetGroup = state.entries[index].groupName;
            let sameGroupIndices = [];
            state.entries.forEach((e, idx) => {
                if (e.groupName === targetGroup) sameGroupIndices.push(idx);
            });

            const currentPosInGroup = sameGroupIndices.indexOf(index);
            const targetPosInGroup = direction === 'up' ? currentPosInGroup - 1 : currentPosInGroup + 1;
            if (targetPosInGroup < 0 || targetPosInGroup >= sameGroupIndices.length) return;

            const targetGlobalIndex = sameGroupIndices[targetPosInGroup];
            [state.entries[index], state.entries[targetGlobalIndex]] = [state.entries[targetGlobalIndex], state.entries[index]];
            
            state.lastScrolledId = null; 
            saveState();
            render();
        }

        function handleDelete(id) {
            if (state.isLocked) return;
            const confirmed = confirm('確定刪除此肢體感言？');
            if (!confirmed) return;
            state.entries = state.entries.filter(e => e.id !== id);
            if (state.activeId === id && state.entries.length) {
                state.activeId = state.entries[0].id;
            } else if (state.entries.length === 0) {
                state.activeId = null;
            }
            state.lastScrolledId = null;
            saveState();
            render();
        }

        function duplicateEntry(id, mode) {
            if(state.isLocked) { alert('目前系統處於 [🔒 全書排版鎖定] 狀態，無法進行複製。'); return; }
            const idx = state.entries.findIndex(e => e.id === id);
            if (idx === -1) return;
            const source = state.entries[idx]; const newId = Date.now().toString(); let newEntry = {};
            if (mode === 'clone') { newEntry = { ...source, id: newId, name: source.name + ' (副本)' }; } 
            else if (mode === 'same_group') {
                newEntry = { id: newId, layout: source.layout, groupName: source.groupName, name: '新肢體成員', role: source.role, title: source.title, headline: source.headline, content: '' };
            }
            state.entries.splice(idx + 1, 0, newEntry); state.activeId = newId; 
            state.lastScrolledId = null;
            saveState(); render();
        }

        function addEntry() {
            if(state.isLocked) { alert('目前系統處於 [🔒 全書排版鎖定] 狀態，無法新增。'); return; }
            const id = Date.now().toString();
            state.entries.push({ id, layout: 'MEMBER_TITLE', groupName: '風吉小組', name: '新肢體成員', role: '(一般組員)', title: '弟兄', headline: '請輸入金句大標', content: '在此輸入感恩感言...' });
            state.activeId = id; 
            state.lastScrolledId = null;
            saveState(); render();
        }

        function updateEntry(id, field, val) {
            if(state.isLocked) return;
            const entry = state.entries.find(e => e.id === id);
            if (entry) entry[field] = val;
            renderCanvas(); saveState();
            if (field === 'name' || field === 'groupName' || field === 'layout') renderSidebar();
        }

        function renderSidebar() {
            const list = document.getElementById('sidebarList');
            if (!list) return;
            ensureGroupOrder();
            const keyword = document.getElementById('searchFilter') ? document.getElementById('searchFilter').value.toLowerCase().trim() : '';
            
            let grouped = {};
            state.entries.forEach(e => {
                let gName = e.groupName || '未分配小組';
                if(!grouped[gName]) grouped[gName] = [];
                grouped[gName].push(e);
            });

            list.innerHTML = state.groupOrder.map(groupName => {
                let items = grouped[groupName];
                if (!items || items.length === 0) return ''; 

                let isFiltered = items.some(e => (((e.name || '').toLowerCase().includes(keyword) || (groupName || '').toLowerCase().includes(keyword))));
                if (keyword && !isFiltered) return '';

                let isCollapsed = state.collapsedGroups[groupName] || false;
                let arrow = isCollapsed ? '▶' : '▼';
                
                let groupHeaderHtml = `
                    <div class="text-xs font-bold text-[#F5A623] bg-slate-900/80 p-2 rounded-lg flex items-center justify-between select-none hover:bg-slate-800 transition-colors">
                        <span class="cursor-pointer flex-1 py-0.5" onclick="state.collapsedGroups['${groupName}'] = !${isCollapsed}; saveState(); renderSidebar();">
                            ${arrow} ${groupName} (${items.length})
                        </span>
                        <div class="flex gap-2 text-[10px] text-gray-400 ${state.isLocked ? 'hidden' : ''}" onclick="event.stopPropagation();">

                    if (keyword && !(e.name || '').toLowerCase().includes(keyword) && !(groupName || '').toLowerCase().includes(keyword)) return '';
                    return `
                        <div class="flex items-center gap-1 group">
                            <div onclick="state.activeId='${e.id}'; state.lastScrolledId=null; render();" class="flex-1 p-2.5 rounded-xl cursor-pointer border transition-all ${state.activeId === e.id ? 'bg-[#F5A623]/20 border-[#F5A623]' : 'border-transparent hover:bg-white/5'}">
                                <div class="text-xs font-bold font-serif text-white">${e.name || '未命名'}</div>
                            </div>
                            <div class="flex flex-col gap-0.5 opacity-0 group-hover:opacity-100 transition-opacity pr-1 ${state.isLocked ? 'hidden' : ''}">
                                <button onclick="moveEntry('${e.id}','up')" class="text-[9px] hover:text-[#F5A623]">▲</button>
                                <button onclick="moveEntry('${e.id}','down')" class="text-[9px] hover:text-[#F5A623]">▼</button>
                            </div>
                        </div>
                    `;
                }).join('') + `</div>`;

                return `<div class="space-y-1 mb-2">${groupHeaderHtml}${membersHtml}</div>`;
            }).join('');

            const totalLabel = document.getElementById('statCount');
            if (totalLabel) totalLabel.innerText = state.entries.length;
        }

        function renderEditor() {
            const ui = document.querySelector('.editor-panel');

            if(len > 220 && len <= 350) { badgeColor = 'text-amber-400'; badgeText = `內容字數偏長 (${len} 字)`; }
            else if(len > 350) { badgeColor = 'text-red-400'; badgeText = `字數過長建議拆頁 (${len} 字)`; }

            ui.innerHTML = `
                <div class="p-5 border-b border-white/10 bg-[#0f1535] sticky top-0 shrink-0 flex items-center justify-between">
                    <h2 class="font-bold text-[#F5A623]">✍ 手冊落版控制台</h2>
                    ${state.isLocked ? '<span class="text-xs bg-red-950 border border-red-500 text-red-400 px-2 py-0.5 rounded font-bold">🔒 全書已鎖定</span>' : ''}
                </div>
                <div id="editorUI" class="flex-1 flex flex-col overflow-y-auto p-6 space-y-5 ${state.isLocked ? 'pointer-events-none opacity-50' : ''}">
                    <div><label class="text-[11px] text-white/60 font-bold">套用手冊出版結構</label>
                        <select onchange="updateEntry('${e.id}','layout',this.value); render();" class="w-full bg-slate-800 border border-white/10 rounded-lg p-3 text-sm text-white outline-none focus:border-[#F5A623]">

                            <select onchange="updateEntry('${e.id}','groupName',this.value); render();" class="w-full bg-slate-800 border border-white/10 rounded-lg p-3 text-sm text-white outline-none">
                                ${GROUP_OPTIONS.map(g => `<option value="${g}" ${e.groupName===g?'selected':''}>${g}</option>`).join('')}
                            </select>

                        <div><label class="text-[11px] text-white/60 font-bold">姓名</label><input oninput="updateEntry('${e.id}','name',this.value)" value="${e.name || ''}" class="w-full bg-slate-800 border border-white/10 rounded-lg p-3 text-sm text-white outline-none"/></div>
                    </div>
                    <div class="grid grid-cols-2 gap-3">
                        <div><label class="text-[11px] text-white/60 font-bold">身份 (職分)</label>
                            <select onchange="updateEntry('${e.id}','role',this.value)" class="w-full bg-slate-800 border border-white/10 rounded-lg p-3 text-sm text-white outline-none">
                                ${ROLE_OPTIONS.map(r => `<option value="${r}" ${e.role===r?'selected':''}>${r}</option>`).join('')}
                            </select>
                        </div>
                        <div><label class="text-[11px] text-white/60 font-bold">稱謂 (弟兄/姊妹)</label>
                            <select onchange="updateEntry('${e.id}','title',this.value)" class="w-full bg-slate-800 border border-white/10 rounded-lg p-3 text-sm text-white outline-none">
                                ${TITLE_OPTIONS.map(t => `<option value="${t}" ${e.title===t?'selected':''}>${t}</option>`).join('')}
                            </select>
                        </div>
                    </div>
                    <div class="${e.layout === 'MEMBER_NOTITLE' ? 'hidden' : 'block'}"><label class="text-[11px] text-[#F5A623] font-bold uppercase tracking-widest">金句破題大標題</label><input oninput="updateEntry('${e.id}','headline',this.value)" value="${e.headline || ''}" class="w-full bg-[#F5A623]/10 border border-[#F5A623]/30 rounded-lg p-3 text-sm text-[#F5A623] font-serif font-black outline-none"/></div>
                    <div class="space-y-1"><div class="flex justify-between text-[10px] uppercase font-bold tracking-widest"><span class="text-white/40">感恩見證內文</span><span class="font-bold ${badgeColor}">${badgeText}</span></div><textarea oninput="updateEntry('${e.id}','content',this.value);" class="w-full bg-slate-800 border border-white/10 rounded-lg p-3 text-sm leading-relaxed text-white outline-none font-sans" style="height: 180px;">${e.content || ''}</textarea></div>
                    <div class="pt-4 border-t border-white/10 space-y-2">
                        <div class="grid grid-cols-2 gap-2">
                            <button onclick="duplicateEntry('${e.id}', 'same_group')" class="py-2.5 rounded-lg bg-blue-950 border border-blue-700/60 text-blue-300 text-xs font-bold hover:bg-blue-900/40 flex items-center justify-center gap-1">👥 ＋ 同小組新增</button>
                            <button onclick="duplicateEntry('${e.id}', 'clone')" class="py-2.5 rounded-lg bg-slate-800 border border-white/10 text-white/80 text-xs font-bold hover:bg-slate-700/50 flex items-center justify-center gap-1">⧉ 複製目前肢體</button>
                        </div>
                        <button onclick="handleDelete('${e.id}')" class="w-full py-2.5 rounded-lg border border-red-500/30 text-red-400 text-xs font-bold hover:bg-red-500/10 block text-center">❌ 刪除此肢體感言</button>
                    </div>
                </div>
            `;
        }

        function renderCanvas() {
            const container = document.getElementById('canvas'); if (!container) return;
            ensureGroupOrder();
            
            const viewport = document.getElementById('scrollViewport');
            const savedScrollTop = viewport ? viewport.scrollTop : 0;

            container.innerHTML = ''; 
            let scratchpad = document.createElement('div');
            scratchpad.style.cssText = "position: absolute; visibility: hidden; width: 210mm; top: -9999px; left: -9999px; z-index:-100;";
            document.body.appendChild(scratchpad);

            let groupStats = {}; state.entries.forEach(e => { groupStats[e.groupName] = (groupStats[e.groupName] || 0) + 1; });
            let initialFlattenedEntries = [];
            
            state.entries.forEach(entry => {
                let paragraphs = (entry.content || '').split('\n').filter(p => p.trim() !== '');
                let testCard = document.createElement('div'); testCard.style.width = "85mm"; testCard.innerHTML = buildCardHTMLString(entry);
                scratchpad.appendChild(testCard); let fullHeight = testCard.getBoundingClientRect().height; scratchpad.removeChild(testCard);

                if (fullHeight > 390 && paragraphs.length > 1 && entry.layout !== 'PASTOR') {
                    let chunk1 = []; let chunk2 = [];
                    for (let i = 0; i < paragraphs.length; i++) {
                        let currentTest = [...chunk1, paragraphs[i]];
                        let pCard = document.createElement('div'); pCard.style.width = "85mm"; 
                        pCard.innerHTML = buildCardHTMLString({ ...entry, content: currentTest.join('\n') });
                        scratchpad.appendChild(pCard);
                        let currentH = pCard.getBoundingClientRect().height;
                        scratchpad.removeChild(pCard);

                        if (currentH <= 390 && chunk2.length === 0) {
                            chunk1.push(paragraphs[i]);
                        } else {
                            chunk2.push(paragraphs[i]);
                        }
                    }
                    if(chunk1.length === 0) chunk1.push(paragraphs[0]);
                    initialFlattenedEntries.push({ ...entry, content: chunk1.join('\n'), headline: entry.headline ? `${entry.headline} (轉下頁)` : '(接續轉下頁)' });
                    initialFlattenedEntries.push({ ...entry, id: entry.id + '_cont', content: chunk2.join('\n'), headline: entry.headline ? `(接續) ${entry.headline}` : '(接續上頁)' });
                } else { initialFlattenedEntries.push(entry); }
            });

            let itemsByGroup = {};
            state.groupOrder.forEach(g => itemsByGroup[g] = []);
            initialFlattenedEntries.forEach(entry => {
                let g = entry.groupName || '未分配小組';
                if (!itemsByGroup[g]) itemsByGroup[g] = [];
                itemsByGroup[g].push(entry);
            });

            let finalQueue = [];
            state.groupOrder.forEach(groupName => {
                let groupItems = itemsByGroup[groupName] || [];
                if (groupItems.length === 0) return;

                let groupPastors = groupItems.filter(e => e.layout === 'PASTOR');
                let groupMembers = groupItems.filter(e => e.layout !== 'PASTOR');

                if (state.smartSort) {
                    groupMembers.sort((a, b) => (b.content || '').length - (a.content || '').length);
                    let balanced = [];
                    while(groupMembers.length > 0) {
                        balanced.push(groupMembers.shift());
                        if(groupMembers.length > 0) balanced.push(groupMembers.pop());
                    }
                    groupMembers = balanced;
                } else {
                    groupMembers.sort((a, b) => {
                        let cleanIdA = a.id.replace('_cont', '');
                        let cleanIdB = b.id.replace('_cont', '');
                        let entIdxA = state.entries.findIndex(x => x.id === cleanIdA);
                        let entIdxB = state.entries.findIndex(x => x.id === cleanIdB);
                        if (entIdxA !== entIdxB) return entIdxA - entIdxB;
                        return a.id.includes('_cont') ? 1 : -1;
                    });
                }
                finalQueue.push(...groupPastors, ...groupMembers);
            });

            // ── 🟢 修正一：完全拔除 CHAPTER 滿版扉頁生成區，讓所有小組百分之百公平流動 ──
            let pages = []; let currentFlowItems = []; let lastGroup = "";
            const MAX_PRINTABLE_HEIGHT = 810; 

            finalQueue.forEach((entry) => {
                if (entry.layout === 'PASTOR') {
                    if (currentFlowItems.length > 0) { pages.push({ type: 'FLOW', items: currentFlowItems }); currentFlowItems = []; }
                    pages.push({ type: 'PASTOR', items: [entry] });
                    lastGroup = entry.groupName;
                } else {
                    let testItems = [...currentFlowItems, entry];
                    let testPage = document.createElement('div'); testPage.className = "book-page";
                    let whiteLayer = document.createElement('div'); whiteLayer.className = "white-layer";
                    let gridEngine = document.createElement('div'); gridEngine.className = "grid-flow-engine pt-2";
                    
                    // 組別感知橫列切斷演算法
                    let rows = []; let currentRow = []; let currentGroup = "";
                    testItems.forEach(item => {
                        if (item.groupName !== currentGroup) {
                            if (currentRow.length > 0) {
                                while (currentRow.length < 2) currentRow.push(null);
                                rows.push(currentRow); currentRow = [];
                            }
                            currentGroup = item.groupName;
                        }
                        currentRow.push(item);
                        if (currentRow.length === 2) { rows.push(currentRow); currentRow = []; }
                    });
                    if (currentRow.length > 0) {
                        while (currentRow.length < 2) currentRow.push(null);
                        rows.push(currentRow);
                    }

                    let lastGroupHeading = "";
                    gridEngine.innerHTML = rows.map(row => {
                        let inlineHeaderHtml = '';
                        if (row[0] && row[0].groupName !== lastGroupHeading) {
                            inlineHeaderHtml = `
                                <div class="flex items-center gap-4 mb-4 avoid-break font-serif text-[#0A2B66] w-full">
                                    <span class="text-sm font-black tracking-widest">${row[0].groupName}</span>
                                    <div class="h-[1px] bg-gradient-to-r from-[#F5A623]/60 to-transparent flex-1"></div>
                                </div>
                            `;
                            lastGroupHeading = row[0].groupName;
                        }
                        return `
                            <div class="w-full avoid-break">
                                ${inlineHeaderHtml}
                                <div class="flex gap-[14mm] mb-[20px] items-stretch w-full">
                                    ${buildCardHTMLString(row[0])}
                                    ${row[1] ? buildCardHTMLString(row[1]) : '<div class="flex-1"></div>'}
                                </div>
                            </div>
                        `;
                    }).join('');
                    
                    whiteLayer.appendChild(gridEngine); 
                    testPage.appendChild(whiteLayer); 
                    scratchpad.appendChild(testPage);
                    
                    let measuredHeight = gridEngine.getBoundingClientRect().height; scratchpad.removeChild(testPage);
                    
                    if (measuredHeight > MAX_PRINTABLE_HEIGHT && currentFlowItems.length > 0) {
                        pages.push({ type: 'FLOW', items: currentFlowItems }); 
                        currentFlowItems = [entry];
                    } else { 
                        currentFlowItems.push(entry); 
                    }
                    lastGroup = entry.groupName;
                }
            });
            if (currentFlowItems.length > 0) pages.push({ type: 'FLOW', items: currentFlowItems });
            document.body.removeChild(scratchpad);

            let pageNum = 7; 
            let displayPages = [...pages];
            let hasAddedBlank = false;
            if (state.viewMode === 'spread' && pageNum % 2 !== 0) {
                displayPages.unshift({ type: 'BLANK' });
                hasAddedBlank = true;
            }

            if (state.viewMode === 'spread') {
                let renderPageNum = hasAddedBlank ? 6 : 7;
                for (let i = 0; i < displayPages.length; i += 2) {
                    const spread = document.createElement('div'); spread.className = "flex shadow-2xl mb-12 relative";
                    let leftPageNum = (displayPages[i].type === 'BLANK') ? null : renderPageNum;
                    let leftHtml = buildPageHTML(displayPages[i], leftPageNum, groupStats); renderPageNum++;
                    
                    let rightHtml = '';
                    if (displayPages[i+1]) {
                        let rightPageNum = (displayPages[i+1].type === 'BLANK') ? null : renderPageNum;
                        rightHtml = buildPageHTML(displayPages[i+1], rightPageNum, groupStats);
                    } else {
                        rightHtml = `<div class="book-page"></div>`;
                    }
                    renderPageNum++;
                    
                    spread.innerHTML = leftHtml + `<div class="w-[20px] -mx-[10px] bg-gradient-to-r from-black/15 via-transparent to-black/15 z-30 pointer-events-none no-print"></div>` + rightHtml;
                    spread.querySelectorAll('.book-page').forEach(el => { el.style.boxShadow = 'none'; el.style.marginBottom = '0'; });
                    container.appendChild(spread);
                }
            } else {
                pages.forEach(p => {
                    const div = document.createElement('div'); div.className = "mb-12 shadow-2xl"; 
                    let currentPageNum = (p.type === 'BLANK') ? null : pageNum;
                    div.innerHTML = buildPageHTML(p, currentPageNum, groupStats);
                    if (div.querySelector('.book-page')) div.querySelector('.book-page').style.boxShadow = 'none'; 
                    container.appendChild(div); pageNum++;
                });
            }

            const pc = document.getElementById('printArea'); if (pc) {
                let pNumCache = 7;
                pc.innerHTML = pages.map(p => { 
                    let currentPageNum = (p.type === 'BLANK') ? null : pNumCache;
                    let html = buildPageHTML(p, currentPageNum, groupStats); pNumCache++; return html; 
                }).join('');
                pc.querySelectorAll('.book-page').forEach(el => el.style.boxShadow = 'none');
            }

            if (viewport) viewport.scrollTop = savedScrollTop;

            setTimeout(validateOverflowGuardrails, 300);

            // 高精縮放對焦定位
            if (state.lastScrolledId !== state.activeId) {
                setTimeout(() => {
                    const targetCard = document.querySelector(`#canvas [data-id="${state.activeId}"], #canvas [data-id="${state.activeId}_cont"]`);
                    if (targetCard && viewport && canvas) {
                        const cardRect = targetCard.getBoundingClientRect();
                        const canvasRect = canvas.getBoundingClientRect();
                        const relativeTop = cardRect.top - canvasRect.top;
                        const targetScrollTop = relativeTop - (viewport.clientHeight / 2) + (cardRect.height / 2);
                        
                        viewport.scrollTo({
                            top: targetScrollTop,
                            behavior: 'auto'
                        });
                    }
                    state.lastScrolledId = state.activeId; 
                }, 50);
            }
        }

        function validateOverflowGuardrails() {
            let cards = document.querySelectorAll('#canvas .entry-card'); let hasOverflow = false;
            cards.forEach(card => {
                if (card.scrollHeight > card.clientHeight + 8) {
                    card.classList.add('card-overflow-error'); hasOverflow = true;
                    if(!card.querySelector('.error-tag')) {
                        let tag = document.createElement('div'); tag.className = "error-tag absolute top-2 right-2 bg-red-600 text-white font-sans text-[10px] px-2 py-0.5 rounded font-bold z-50 shadow";
                        tag.innerText = "⚠️ 內容溢出，請點全書健檢"; card.appendChild(tag);
                    }
                }
            });
            const safetyBadge = document.getElementById('safetyBadge'); const btnExport = document.getElementById('btnExportPdf');
            if (hasOverflow) {
                if (safetyBadge) {
                    safetyBadge.className = "ml-8 px-4 py-1.5 rounded-full bg-red-950/80 border border-red-500 text-red-400 text-xs font-bold flex items-center gap-2 no-print";
                    safetyBadge.innerHTML = `<span class="w-2 h-2 rounded-full bg-red-500 animate-ping"></span> 出版警告：偵測到內容溢出`;
                }
                if (btnExport) {
                    btnExport.disabled = true; btnExport.className = "px-6 py-2 rounded-full bg-gray-700 text-gray-400 text-sm font-bold cursor-not-allowed opacity-50";
                }
            } else { saveState(); }
        }

        function buildPageHTML(pageData, pageNum, groupStats) {
            const isLeft = pageNum ? (pageNum % 2 === 0) : false;
            const pd = isLeft ? 'padding: 24mm 22mm 24mm 18mm;' : 'padding: 24mm 18mm 24mm 22mm;';
            let contentHTML = ''; 

            if (pageData.type === 'BLANK') {
                return `
                    <div class="book-page">
                        <div class="white-layer justify-center items-center bg-[#fcfbf9]" style="${pd}">
                            <div class="text-gray-300 font-serif text-sm tracking-widest italic select-none">Royal Chosen Race Church</div>
                        </div>
                    </div>
                `;
            }

            if (pageData.type === 'PASTOR') {
                const item = pageData.items[0];
                const identityText = (item.role && item.role !== '(一般組員)') ? item.role : '';
                const titleText = (item.title && item.title !== '(無稱謂)') ? item.title : '';
                
                contentHTML = `
                    <div class="white-layer" style="${pd}" data-id="${item.id}">
                        <div class="flex justify-between items-end border-b border-gray-200 pb-3 mb-6 font-serif">
                            <div class="text-[12.5px] font-black text-[#0A2B66] tracking-[0.1em]">十載主恩 ‧ 憐憫無窮<br><span class="text-[9.5px] text-gray-400 font-sans font-normal">風一族職場教會十週年感言冊</span></div>
                            <div class="text-[#F5A623] text-xs font-bold tracking-widest uppercase font-sans">${(item.groupName || '').substring(0,2)}</div>
                        </div>
                        <div class="flex flex-col flex-1 h-full pt-4">
                            <div class="mb-10 font-serif flex items-center justify-center p-6 border border-[#F5A623]/25 bg-[#F5A623]/5 rounded-2xl relative max-w-[90%] mx-auto shadow-sm min-h-[96px]">
                                <span class="text-[#F5A623] text-4xl font-black leading-none self-center -mt-1">“</span>
                                <span class="text-[#0A2B66] font-black text-[22px] px-4 tracking-wide text-center leading-relaxed flex-1">${item.headline || ''}</span>
                                <span class="text-[#F5A623] text-4xl font-black leading-none self-center mt-3">”</span>
                            </div>
                            <div class="text-center mb-8">
                                <div class="inline-flex items-center justify-center gap-3 border-b-2 border-[#F5A623] pb-2 px-6 font-serif">
                                    <span class="text-[20px] font-black text-[#0A2B66] tracking-widest">${item.name || ''}</span>
                                    <span class="text-[14px] font-bold text-gray-500 font-sans tracking-widest">${identityText} ${titleText}</span>
                                </div>
                            </div>
                            <div class="pastor-content text-[14px] leading-[1.9] text-gray-700 font-sans font-normal text-justify flex-1 tracking-[0.02em]">
                                ${(item.content || '').split('\n').filter(p=>p.trim()!=='').map(p => `<p style="text-indent: 2em; margin-bottom: 1em;">${p}</p>`).join('')}
                            </div>
                        </div>
                    </div>
                `;
            } else {
                let rows = []; for(let i = 0; i < pageData.items.length; i += 2) { rows.push([pageData.items[i], pageData.items[i+1]]); }
                
                let lastGroupHeading = "";
                contentHTML = rows.map((row) => {
                    let inlineHeaderHtml = '';
                    if (row[0] && row[0].groupName !== lastGroupHeading) {
                        inlineHeaderHtml = `
                            <div class="flex items-center gap-4 mb-4 avoid-break font-serif text-[#0A2B66] w-full">
                                <span class="text-sm font-black tracking-widest">${row[0].groupName}</span>
                                <div class="h-[1px] bg-gradient-to-r from-[#F5A623]/60 to-transparent flex-1"></div>
                            </div>
                        `;
                        lastGroupHeading = row[0].groupName;
                    }
                    return `
                        <div class="w-full avoid-break">
                            ${inlineHeaderHtml}
                            <div class="flex gap-[14mm] mb-[20px] items-stretch w-full">
                                ${buildCardHTMLString(row[0])}
                                ${row[1] ? buildCardHTMLString(row[1]) : '<div class="flex-1"></div>'}
                            </div>
                        </div>
                    `;
                }).join('');

                contentHTML = `
                    <div class="white-layer" style="${pd}">
                        <div class="flex justify-between items-end border-b border-gray-200 pb-3 mb-5 font-serif">
                            <div class="text-[12.5px] font-black text-[#0A2B66] tracking-[0.1em]">十載主恩 ‧ 憐憫無窮<br><span class="text-[9.5px] text-gray-400 font-sans font-normal">風一族職場教會 10 週年紀念</span></div>
                            <div class="text-[#F5A623] text-lg opacity-60">✦ ✦</div>
                        </div>
                        <div class="flex-1 overflow-hidden pt-2 grid-flow-engine">${contentHTML}</div>
                    </div>
                `;
            }

            return `
            <div class="book-page">
                <div class="corner-top-right no-print"></div><div class="corner-bottom-left no-print"></div>
                ${contentHTML}
                
                ${pageNum ? `
                <div class="absolute bottom-[16mm] ${isLeft ? 'left-[24mm]' : 'right-[24mm]'} text-[11px] font-sans font-bold text-gray-300 tracking-[3px] z-20">
                    Royal Chosen Race Church ‧ P.${pageNum}
                </div>
                ` : ''}
            </div>`;
        }

        function buildCardHTMLString(item) {
            if(!item) return '';
            
            const identityText = (item.role && item.role !== '(一般組員)') ? item.role : '';
            const titleText = (item.title && item.title !== '(無稱謂)') ? item.title : '';

            return `
            <div class="entry-card flex-1 flex flex-col h-full relative" data-id="${item.id}">
                <div class="flex items-center gap-3 mb-4 font-serif shrink-0">
                    <div class="w-[48px] h-[48px] rounded-full bg-[#0A2B66] border-[2px] border-[#F5A623] flex items-center justify-center text-[#F5A623] text-[16px] font-black shadow-sm shrink-0 font-sans tracking-wide">
                        ${(item.groupName||'').substring(0,2)}
                    </div>
                    <div class="text-[19px] font-black text-[#0A2B66] tracking-widest flex items-baseline">
                        <span class="text-[#F5A623] text-[13px] mr-1.5 relative -top-0.5">✦</span>${item.name || ''} 
                        <span class="text-[13px] font-bold text-gray-400 ml-2 font-sans tracking-normal">${identityText} ${titleText}</span>
                    </div>
                </div>
                ${item.layout === 'MEMBER_TITLE' && item.headline ? `
                    <div class="text-left mb-4 font-serif border-l-[3px] border-[#F5A623] pl-3 shrink-0 avoid-break">
                        <h3 class="text-[14.5px] font-bold text-[#0A2B66] leading-relaxed tracking-wide">${item.headline}</h3>
                    </div>
                ` : ''}
                <div class="text-[15px] leading-[1.75] text-gray-700 font-sans font-normal text-justify tracking-[0.02em] flex-1 px-1">
                    ${(item.content || '').split('\n').filter(p=>p.trim()!=='').map(p => `<p style="text-indent: 2em; margin-bottom: 0.6em;">${p}</p>`).join('')}
                </div>
                <div class="w-full mt-4 border-t-[1.5px] border-dotted border-[#F5A623]/40 opacity-60 shrink-0"></div>
            </div>`;
        }

        // 開機初始化
        loadState();
        render();
    </script>
</body>
</html>
